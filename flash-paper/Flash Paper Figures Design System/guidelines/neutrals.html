<!-- @dsCard group="Colors" viewport="700x120" name="Neutrals" subtitle="Ink + gray ramp on an always-white background" -->
<!DOCTYPE html>
<html><head><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;background:#fff;font-family:var(--font-sans);color:var(--ink)}
.row{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;padding:14px}
.sw{border:1px solid var(--gray-line);border-radius:8px;overflow:hidden}
.chip{height:40px}
.meta{padding:7px 10px;font-size:12px;line-height:1.35}
.meta b{display:block;font-size:12.5px}
</style></head>
<body>
<div class="row">
  <div class="sw"><div class="chip" style="background:var(--ink)"></div><div class="meta"><b>#2C2C2A</b>ink — titles</div></div>
  <div class="sw"><div class="chip" style="background:var(--gray-strong)"></div><div class="meta"><b>#374151</b>body text</div></div>
  <div class="sw"><div class="chip" style="background:var(--gray-mid)"></div><div class="meta"><b>#6B7280</b>captions</div></div>
  <div class="sw"><div class="chip" style="background:var(--gray-soft)"></div><div class="meta"><b>#9CA3AF</b>muted strokes</div></div>
  <div class="sw"><div class="chip" style="background:var(--gray-line)"></div><div class="meta"><b>#E5E7EB</b>hairlines</div></div>
  <div class="sw"><div class="chip" style="background:var(--gray-tint);border-bottom:1px solid var(--gray-line)"></div><div class="meta"><b>#F9FAFB</b>neutral panel</div></div>
</div>
</body></html>
