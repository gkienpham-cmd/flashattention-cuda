<!-- @dsCard group="Type" viewport="700x180" name="Type scale" subtitle="Helvetica/Arial; sized for ~50% print shrink; 13px floor" -->
<!DOCTYPE html>
<html><head><link rel="stylesheet" href="../styles.css"><style>
body{margin:0;background:#fff;font-family:var(--font-sans);color:var(--ink)}
.col{display:flex;flex-direction:column;gap:10px;padding:16px 20px}
.spec{display:flex;align-items:baseline;gap:16px}
.tok{width:190px;font-family:var(--font-mono);font-size:11px;color:var(--gray-mid);flex:none}
</style></head>
<body>
<div class="col">
  <div class="spec"><span class="tok">--fig-title-size · 22/700</span><span style="font-size:var(--fig-title-size);font-weight:700">Figure title</span></div>
  <div class="spec"><span class="tok">--fig-heading-size · 16/700</span><span style="font-size:var(--fig-heading-size);font-weight:700;color:var(--blue-dark)">Panel heading</span></div>
  <div class="spec"><span class="tok">--fig-label-size · 14/700</span><span style="font-size:var(--fig-label-size);font-weight:700">Chip label / table header</span></div>
  <div class="spec"><span class="tok">--fig-body-size · 13/400</span><span style="font-size:var(--fig-body-size);color:var(--gray-strong)">List item, takeaway, axis label — nothing smaller than 13px</span></div>
  <div class="spec"><span class="tok">--fig-subtitle-size · 13/400</span><span style="font-size:var(--fig-subtitle-size);color:var(--gray-mid)">Gray subtitle under the title</span></div>
</div>
</body></html>
