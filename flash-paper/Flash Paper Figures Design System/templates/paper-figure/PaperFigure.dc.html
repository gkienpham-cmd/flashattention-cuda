<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- @template name="Paper figure" description="Blank house-style IEEE figure canvas (column width) with title, subtitle, and two comparison panels" -->
<helmet><script src="./ds-base.js"></script></helmet>
<div style="width: 600px; background: #FFFFFF; box-sizing: border-box; padding: 20px 20px 24px; font-family: Helvetica, Arial, sans-serif">
  <div style="font-size: 22px; font-weight: 700; color: #2C2C2A">Figure title in sentence case</div>
  <div style="font-size: 13px; color: #6B7280; margin-top: 6px">Gray subtitle — context, units, constants</div>
  <div style="display: flex; gap: 16px; margin-top: 18px">
    <div style="flex: 1; background: #F0FDF4; border: 1.5px solid #22C55E; border-radius: 10px; padding: 14px 16px">
      <div style="font-size: 16px; font-weight: 700; color: #15803D">Left panel</div>
      <div style="display: flex; gap: 8px; align-items: baseline; font-size: 13px; color: #166534; margin-top: 12px"><span style="font-weight: 700; color: #22C55E; font-size: 15px">✓</span><span>A verbatim claim or item</span></div>
      <div style="display: flex; gap: 8px; align-items: baseline; font-size: 13px; color: #166534; margin-top: 8px"><span style="font-weight: 700; color: #22C55E; font-size: 15px">✓</span><span>Another item</span></div>
    </div>
    <div style="flex: 1; background: #FEF2F2; border: 1.5px solid #EF4444; border-radius: 10px; padding: 14px 16px">
      <div style="font-size: 16px; font-weight: 700; color: #B91C1C">Right panel</div>
      <div style="display: flex; gap: 8px; align-items: baseline; font-size: 13px; color: #991B1B; margin-top: 12px"><span style="font-weight: 700; color: #EF4444; font-size: 15px">✗</span><span>A verbatim non-claim</span></div>
      <div style="display: flex; gap: 8px; align-items: baseline; font-size: 13px; color: #991B1B; margin-top: 8px"><span style="font-weight: 700; color: #EF4444; font-size: 15px">✗</span><span>Another item</span></div>
    </div>
  </div>
  <div style="font-size: 13px; color: #374151; text-align: center; margin-top: 20px">Centered caption line — full sentences allowed here.</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 640, &quot;height&quot;: 340}}"></script>
</body>
</html>
