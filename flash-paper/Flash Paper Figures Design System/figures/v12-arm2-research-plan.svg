<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6B7280"></path>
    </marker>
  </defs>
  <rect width="600" height="300" fill="#FFFFFF"></rect>
  <text x="20" y="32" font-size="22" font-weight="700" fill="#2C2C2A">Does native FP4 compute help decode?</text>

  
  <rect x="20" y="52" width="330" height="168" rx="10" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.5"></rect>
  <text x="36" y="80" font-size="15" font-weight="700" fill="#B91C1C">Stage A (measured, B300)</text>
  <text x="36" y="104" font-size="13" fill="#374151">FP4 vs FP8 GEMM at M=128 (MLA decode)</text>
  <text x="36" y="124" font-size="13" fill="#374151">Both HBM-bound: AI 100–176</text>
  <text x="36" y="144" font-size="13" fill="#374151">FP4 ≤ 5.8% of 15 PF peak</text>
  <text x="36" y="164" font-size="13" fill="#374151">FP8 ≤ 21.7% of 5 PF peak</text>
  <text x="36" y="198" font-size="14" font-weight="700" fill="#B91C1C">KILL: FP4 compute never the limiter</text>

  
  <line x1="356" y1="136" x2="392" y2="136" stroke="#6B7280" stroke-width="2" marker-end="url(#arrow)"></line>

  
  <rect x="400" y="88" width="180" height="96" rx="10" fill="#F9FAFB" stroke="#9CA3AF" stroke-width="1.5" stroke-dasharray="6 4"></rect>
  <text x="490" y="118" font-size="14" font-weight="700" fill="#6B7280" text-anchor="middle">Stage B (accuracy) /</text>
  <text x="490" y="136" font-size="14" font-weight="700" fill="#6B7280" text-anchor="middle">Stage C (kernel)</text>
  <text x="490" y="160" font-size="13" fill="#9CA3AF" text-anchor="middle">not triggered</text>

  
  <rect x="20" y="242" width="560" height="40" rx="8" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"></rect>
  <text x="300" y="267" font-size="14" font-weight="700" fill="#1D4ED8" text-anchor="middle">FP4/NVFP4 is a capacity + accuracy lever, not a decode-compute lever.</text>
</svg>