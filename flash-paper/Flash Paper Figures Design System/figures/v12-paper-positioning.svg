<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 252" width="600" height="252" font-family="Helvetica, Arial, sans-serif">
  <rect width="600" height="252" fill="#FFFFFF"></rect>
  <text x="20" y="32" font-size="22" font-weight="700" fill="#2C2C2A">Positioning: complement, not beat</text>

  
  <rect x="20" y="48" width="272" height="192" rx="10" fill="#F0FDF4" stroke="#22C55E" stroke-width="1.5"></rect>
  <text x="36" y="76" font-size="16" font-weight="700" fill="#15803D">We claim</text>
  <text x="36" y="102" font-size="13" fill="#166534"><tspan font-weight="700" fill="#22C55E">✓</tspan>  First open prediction-vs-measured</text>
  <text x="50" y="118" font-size="13" fill="#166534">decode roofline on sm_103</text>
  <text x="36" y="142" font-size="13" fill="#166534"><tspan font-weight="700" fill="#22C55E">✓</tspan>  MHA → GQA → MLA ×</text>
  <text x="50" y="158" font-size="13" fill="#166534">FP16 → FP8 → NVFP4</text>
  <text x="36" y="182" font-size="13" fill="#166534"><tspan font-weight="700" fill="#22C55E">✓</tspan>  Per-CTA wall = work-starvation</text>
  <text x="36" y="206" font-size="13" fill="#166534"><tspan font-weight="700" fill="#22C55E">✓</tspan>  Two-layer model, predictions</text>
  <text x="50" y="222" font-size="13" fill="#166534">pre-registered before coding</text>

  
  <rect x="308" y="48" width="272" height="192" rx="10" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.5"></rect>
  <text x="324" y="76" font-size="16" font-weight="700" fill="#B91C1C">We do NOT claim</text>
  <text x="324" y="102" font-size="13" fill="#991B1B"><tspan font-weight="700" fill="#EF4444">✗</tspan>  Faster than FlashInfer /</text>
  <text x="338" y="118" font-size="13" fill="#991B1B">FlashMLA / cuDNN</text>
  <text x="324" y="142" font-size="13" fill="#991B1B"><tspan font-weight="700" fill="#EF4444">✗</tspan>  A novel roofline method</text>
  <text x="324" y="166" font-size="13" fill="#991B1B"><tspan font-weight="700" fill="#EF4444">✗</tspan>  First to run on sm_103</text>
  <text x="338" y="182" font-size="13" fill="#991B1B">(FA4 already deployed)</text>
  <text x="324" y="206" font-size="13" fill="#991B1B"><tspan font-weight="700" fill="#EF4444">✗</tspan>  A new SOTA kernel: v12</text>
  <text x="338" y="222" font-size="13" fill="#991B1B">measured NVIDIA&#39;s own kernel</text>
</svg>