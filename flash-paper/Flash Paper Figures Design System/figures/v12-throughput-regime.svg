<svg width="100%" viewBox="0 0 600 400" role="img" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<title>v12 MLA decode throughput scales with total work B x K on B300</title>
<desc>Grouped bar chart: achieved % of the 5 PF FP8 peak vs context K for batch B=1 (blue) and B=64 (red). B=1 single-stream stays 1-16% (work-starved); B=64 climbs to 35.7%. v11 CUDA-core is flat near zero.</desc>
<rect x="0" y="0" width="600" height="400" fill="#ffffff"></rect>

<text x="30" y="34" font-size="23" font-weight="700" fill="#2C2C2A">Throughput scales with work B×K</text>


<line x1="86" y1="90" x2="86" y2="300" stroke="#6B7280" stroke-width="1.5"></line>
<line x1="86" y1="300" x2="560" y2="300" stroke="#6B7280" stroke-width="1.5"></line>
<text x="30" y="195" font-size="16" fill="#374151" transform="rotate(-90 30 195)" text-anchor="middle">% of FP8 peak</text>


<line x1="86" y1="247.5" x2="560" y2="247.5" stroke="#E5E7EB" stroke-width="1"></line>
<line x1="86" y1="195" x2="560" y2="195" stroke="#E5E7EB" stroke-width="1"></line>
<line x1="86" y1="142.5" x2="560" y2="142.5" stroke="#E5E7EB" stroke-width="1"></line>
<line x1="86" y1="90" x2="560" y2="90" stroke="#E5E7EB" stroke-width="1"></line>
<text x="78" y="305" font-size="14" fill="#6B7280" text-anchor="end">0</text>
<text x="78" y="252" font-size="14" fill="#6B7280" text-anchor="end">10</text>
<text x="78" y="200" font-size="14" fill="#6B7280" text-anchor="end">20</text>
<text x="78" y="147" font-size="14" fill="#6B7280" text-anchor="end">30</text>
<text x="78" y="95" font-size="14" fill="#6B7280" text-anchor="end">40</text>


<rect x="143" y="294.7" width="22" height="5.3" fill="#3B82F6"></rect>
<rect x="167" y="200.8" width="22" height="99.2" fill="#EF4444"></rect>
<text x="166" y="318" font-size="15" fill="#374151" text-anchor="middle">8K</text>


<rect x="253" y="288.4" width="22" height="11.6" fill="#3B82F6"></rect>
<rect x="277" y="145.1" width="22" height="154.9" fill="#EF4444"></rect>
<text x="276" y="318" font-size="15" fill="#374151" text-anchor="middle">32K</text>


<rect x="363" y="269" width="22" height="31" fill="#3B82F6"></rect>
<rect x="387" y="119.9" width="22" height="180.1" fill="#EF4444"></rect>
<text x="386" y="318" font-size="15" fill="#374151" text-anchor="middle">131K</text>


<rect x="473" y="217" width="22" height="83" fill="#3B82F6"></rect>
<rect x="497" y="112.5" width="22" height="187.5" fill="#EF4444"></rect>
<text x="496" y="318" font-size="15" fill="#374151" text-anchor="middle">524K</text>
<text x="323" y="340" font-size="15" fill="#374151" text-anchor="middle">context length K</text>


<text x="178" y="196" font-size="13" fill="#B91C1C" text-anchor="middle">18.9</text>
<text x="288" y="140" font-size="13" fill="#B91C1C" text-anchor="middle">29.5</text>
<text x="398" y="115" font-size="13" fill="#B91C1C" text-anchor="middle">34.3</text>
<text x="508" y="108" font-size="13" fill="#B91C1C" text-anchor="middle">35.7</text>


<rect x="90" y="356" width="14" height="14" fill="#3B82F6"></rect>
<text x="110" y="368" font-size="15" fill="#374151">B=1 (single-stream)</text>
<rect x="290" y="356" width="14" height="14" fill="#EF4444"></rect>
<text x="310" y="368" font-size="15" fill="#374151">B=64 (serving batch)</text>


<rect x="360" y="42" width="200" height="52" rx="6" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.2"></rect>
<text x="372" y="60" font-size="15" font-weight="700" fill="#1D4ED8">1–2% → 46% HBM</text>
<text x="372" y="76" font-size="14" fill="#374151">as B×K grows.</text>
<text x="372" y="90" font-size="14" fill="#374151">v11: flat 0.75 TF.</text>
</svg>