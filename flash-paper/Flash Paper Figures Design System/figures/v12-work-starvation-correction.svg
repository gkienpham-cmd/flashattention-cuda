<svg width="100%" viewBox="0 0 600 340" role="img" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<title>The per-CTA wall was work-starvation - v12 correction</title>
<desc>Left: CUDA-core decode (v6-v11) is flat at 0.75 TFLOP/s regardless of the lever tried. Right: the same MLA shape on tcgen05 tensor cores (v12) scales 2.4 to 1785 TFLOP/s with total work. The engine is the lever.</desc>
<rect x="0" y="0" width="600" height="340" fill="#ffffff"></rect>

<text x="30" y="34" font-size="23" font-weight="700" fill="#2C2C2A">The per-CTA wall was work-starvation</text>


<rect x="10" y="58" width="260" height="256" rx="8" fill="#FEF3E4" stroke="#F59E0B" stroke-width="1.4"></rect>
<text x="30" y="84" font-size="16" font-weight="700" fill="#B45309">CUDA-core (v6–v11)</text>
<text x="30" y="104" font-size="15" fill="#B45309">every lever → flat 0.75 TF</text>


<g fill="#F59E0B">
<rect x="104" y="122" width="150" height="18" rx="2"></rect>
<rect x="104" y="148" width="150" height="18" rx="2"></rect>
<rect x="104" y="174" width="150" height="18" rx="2"></rect>
<rect x="104" y="200" width="150" height="18" rx="2"></rect>
<rect x="104" y="226" width="150" height="18" rx="2"></rect>
<rect x="104" y="252" width="150" height="18" rx="2"></rect>
</g>
<g font-size="15" fill="#374151" text-anchor="end">
<text x="96" y="135">v6 split-KV</text>
<text x="96" y="161">v7 paged</text>
<text x="96" y="187">v8 GQA</text>
<text x="96" y="213">v8.7 score</text>
<text x="96" y="239">v9 FP8</text>
<text x="96" y="265">v11 MLA</text>
</g>
<text x="30" y="292" font-size="14" fill="#B45309">dead ends: TC, double-buffer,</text>
<text x="30" y="308" font-size="14" fill="#B45309">ILP, occupancy, bytes.</text>


<text x="300" y="180" font-size="15" font-weight="700" fill="#3B82F6" text-anchor="middle">swap</text>
<text x="300" y="198" font-size="15" font-weight="700" fill="#3B82F6" text-anchor="middle">engine</text>
<path d="M283 214 L317 214" stroke="#3B82F6" stroke-width="2.4" marker-end="url(#ar)"></path>
<defs><marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6 z" fill="#3B82F6"></path></marker></defs>


<rect x="330" y="58" width="260" height="256" rx="8" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.4"></rect>
<text x="346" y="84" font-size="16" font-weight="700" fill="#1D4ED8">tcgen05 (v12)</text>
<text x="346" y="104" font-size="15" fill="#374151">2.4 → 1785 TF with work</text>


<g fill="#3B82F6">
<rect x="358" y="126" width="5.7" height="18" rx="2"></rect>
<rect x="358" y="156" width="33.1" height="18" rx="2"></rect>
<rect x="358" y="186" width="105.9" height="18" rx="2"></rect>
<rect x="358" y="216" width="192.4" height="18" rx="2"></rect>
<rect x="358" y="246" width="200" height="18" rx="2"></rect>
</g>
<g font-size="14" fill="#374151">
<text x="370" y="140">B1 K8K: 51</text>
<text x="397" y="170">B1 K131K: 295</text>
<text x="366" y="204" fill="#fff">B64 K8K: 945</text>
<text x="366" y="230" fill="#fff">B64 K131K: 1717</text>
<text x="366" y="260" fill="#fff">B64 K524K: 1785</text>
</g>
<text x="346" y="292" font-size="14" fill="#374151">36% FP8 peak / 46% HBM</text>
<text x="346" y="308" font-size="14" fill="#374151">at serving scale.</text>
</svg>