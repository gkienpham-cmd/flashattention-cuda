<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="600" height="300" font-family="Helvetica, Arial, sans-serif">
  <rect width="600" height="300" fill="#FFFFFF"></rect>
  <text x="20" y="30" font-size="22" font-weight="700" fill="#2C2C2A">Each engine sets its own ridge</text>
  <text x="20" y="50" font-size="13" fill="#6B7280">MLA decode AI = 835 FLOP/byte; HBM 8 TB/s</text>

  

  
  <text x="270" y="72" font-size="14" font-weight="700" fill="#2C2C2A" text-anchor="middle">AI = 835</text>
  <line x1="270.4" y1="78" x2="270.4" y2="258" stroke="#374151" stroke-width="1.5" stroke-dasharray="5 4"></line>

  
  <text x="62" y="105" font-size="13" font-weight="700" fill="#374151" text-anchor="end">FP16</text>
  <rect x="70" y="88" width="74.9" height="24" rx="4" fill="#BBF7D0" stroke="#22C55E"></rect>
  <rect x="149" y="95" width="176" height="16" fill="#FFFFFF"></rect>
  <text x="153" y="105" font-size="13" font-weight="700" fill="#15803D">ridge 312 → compute-bound</text>

  <text x="62" y="151" font-size="13" font-weight="700" fill="#374151" text-anchor="end">FP8</text>
  <rect x="70" y="134" width="150" height="24" rx="4" fill="#BBF7D0" stroke="#22C55E"></rect>
  <rect x="224" y="141" width="220" height="16" fill="#FFFFFF"></rect>
  <text x="228" y="151" font-size="13" font-weight="700" fill="#15803D">ridge 625 → compute (knife-edge)</text>

  <text x="62" y="197" font-size="13" font-weight="700" fill="#374151" text-anchor="end">NVFP4</text>
  <rect x="70" y="180" width="450" height="24" rx="4" fill="#FECACA" stroke="#EF4444"></rect>
  <text x="285" y="222" font-size="13" font-weight="700" fill="#B91C1C">ridge 1875 → HBM-bound (peak unreachable)</text>

  
  <text x="256" y="244" font-size="13" fill="#15803D" text-anchor="end">ridge &lt; AI: compute-bound</text>
  <text x="284" y="244" font-size="13" fill="#B91C1C">ridge &gt; AI: HBM-bound</text>

  
  <line x1="70" y1="258" x2="550" y2="258" stroke="#9CA3AF" stroke-width="1"></line>
  <text x="310" y="280" font-size="13" fill="#6B7280" text-anchor="middle">ridge = peak / bandwidth (FLOP/byte)</text>
</svg>