<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" width="600" height="320" font-family="Helvetica, Arial, sans-serif">
  <rect width="600" height="320" fill="#FFFFFF"></rect>
  <text x="20" y="32" font-size="22" font-weight="700" fill="#2C2C2A">Two-layer prediction model</text>

  
  <rect x="20" y="50" width="272" height="212" rx="10" fill="#F9FAFB" stroke="#9CA3AF" stroke-width="1.5"></rect>
  <text x="36" y="78" font-size="16" font-weight="700" fill="#374151">Layer 1: pure roofline</text>
  <text x="36" y="98" font-size="13" fill="#6B7280">AI = FLOPs / bytes; peak roofs</text>
  <text x="36" y="126" font-size="14" font-weight="700" fill="#2C2C2A">Blind to:</text>
  <text x="36" y="148" font-size="13" fill="#B91C1C"><tspan font-weight="700" fill="#EF4444">✗</tspan>  L2 cache (hides HBM traffic)</text>
  <text x="36" y="168" font-size="13" fill="#B91C1C"><tspan font-weight="700" fill="#EF4444">✗</tspan>  per-CTA schedule / occupancy</text>
  <text x="36" y="188" font-size="13" fill="#B91C1C"><tspan font-weight="700" fill="#EF4444">✗</tspan>  pipeline fill (work-starvation)</text>
  <text x="36" y="226" font-size="13" fill="#6B7280">Wrong regime at every</text>
  <text x="36" y="242" font-size="13" fill="#6B7280">single-stream decode step.</text>

  
  <rect x="308" y="50" width="272" height="212" rx="10" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5"></rect>
  <text x="324" y="78" font-size="16" font-weight="700" fill="#1D4ED8">Layer 2: per-CTA-corrected</text>
  <text x="324" y="98" font-size="13" fill="#374151">same AI + the schedule</text>
  <text x="324" y="126" font-size="14" font-weight="700" fill="#2C2C2A">Adds:</text>
  <text x="324" y="148" font-size="13" fill="#15803D"><tspan font-weight="700" fill="#22C55E">✓</tspan>  smem/TMEM → occupancy</text>
  <text x="324" y="168" font-size="13" fill="#15803D"><tspan font-weight="700" fill="#22C55E">✓</tspan>  GEMV vs GEMM (M=1 / 128)</text>
  <text x="324" y="188" font-size="13" fill="#15803D"><tspan font-weight="700" fill="#22C55E">✓</tspan>  pipeline depth; counter-prediction</text>
  <text x="324" y="226" font-size="13" font-weight="700" fill="#1D4ED8">Matched the limiter</text>
  <text x="324" y="242" font-size="13" font-weight="700" fill="#1D4ED8">at all 7 decode steps.</text>

  
  <text x="300" y="292" font-size="13.5" fill="#374151" text-anchor="middle">Both predictions are pre-registered before coding;</text>
  <text x="300" y="310" font-size="13.5" fill="#374151" text-anchor="middle">the gap between the layers is the finding.</text>
</svg>