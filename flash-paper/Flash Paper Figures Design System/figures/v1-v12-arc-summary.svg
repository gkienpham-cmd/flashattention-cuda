<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" font-family="Helvetica, Arial, sans-serif">
  <rect width="760" height="360" fill="#FFFFFF"></rect>
  <text x="20" y="30" font-size="22" font-weight="700" fill="#2C2C2A">The v1→v12 arc: four phases, one variable each</text>

  
  <text x="20" y="60" font-size="15" font-weight="700" fill="#6D28D9">1 · Prefill schedule</text>
  <g>
    <rect x="20" y="74" width="168" height="42" rx="8" fill="#F5F3FF" stroke="#C4B5FD"></rect>
    <text x="30" y="91" font-size="14" font-weight="700" fill="#6D28D9">v1 naive</text>
    <text x="30" y="108" font-size="13" fill="#374151">HBM-bound; L2 masks it</text>
    <circle cx="173" cy="89" r="5" fill="#F59E0B"></circle>
  </g>
  <g>
    <rect x="20" y="124" width="168" height="42" rx="8" fill="#F5F3FF" stroke="#C4B5FD"></rect>
    <text x="30" y="141" font-size="14" font-weight="700" fill="#6D28D9">v2 tiled</text>
    <text x="30" y="158" font-size="13" fill="#374151">3× faster; 0% DRAM cut</text>
    <circle cx="173" cy="139" r="5" fill="#EF4444"></circle>
  </g>
  <g>
    <rect x="20" y="174" width="168" height="42" rx="8" fill="#F5F3FF" stroke="#C4B5FD"></rect>
    <text x="30" y="191" font-size="14" font-weight="700" fill="#6D28D9">v3 online</text>
    <text x="30" y="208" font-size="13" fill="#374151">S gone; 3–7× slower</text>
    <circle cx="173" cy="189" r="5" fill="#EF4444"></circle>
  </g>
  <g>
    <rect x="20" y="224" width="168" height="42" rx="8" fill="#F5F3FF" stroke="#C4B5FD"></rect>
    <text x="30" y="241" font-size="14" font-weight="700" fill="#6D28D9">v4 fused</text>
    <text x="30" y="258" font-size="13" fill="#374151">1.7–2.6×; GEMV wall</text>
    <circle cx="173" cy="239" r="5" fill="#EF4444"></circle>
  </g>
  <g>
    <rect x="20" y="274" width="168" height="42" rx="8" fill="#F5F3FF" stroke="#C4B5FD"></rect>
    <text x="30" y="291" font-size="14" font-weight="700" fill="#6D28D9">v5 WMMA</text>
    <text x="30" y="308" font-size="13" fill="#374151">predicted, not measured</text>
    <circle cx="173" cy="289" r="5" fill="#9CA3AF"></circle>
  </g>

  
  <text x="208" y="60" font-size="15" font-weight="700" fill="#1D4ED8">2 · Decode schedule</text>
  <g>
    <rect x="208" y="74" width="168" height="42" rx="8" fill="#EFF6FF" stroke="#93C5FD"></rect>
    <text x="218" y="91" font-size="14" font-weight="700" fill="#1D4ED8">v6 split-KV</text>
    <text x="218" y="108" font-size="13" fill="#374151">5.7–8.2×; per-CTA</text>
    <circle cx="361" cy="89" r="5" fill="#EF4444"></circle>
  </g>
  <g>
    <rect x="208" y="124" width="168" height="42" rx="8" fill="#EFF6FF" stroke="#93C5FD"></rect>
    <text x="218" y="141" font-size="14" font-weight="700" fill="#1D4ED8">v7 paged</text>
    <text x="218" y="158" font-size="13" fill="#374151">flat %HBM, all batch</text>
    <circle cx="361" cy="139" r="5" fill="#EF4444"></circle>
  </g>
  <g>
    <rect x="208" y="174" width="168" height="42" rx="8" fill="#EFF6FF" stroke="#93C5FD"></rect>
    <text x="218" y="191" font-size="14" font-weight="700" fill="#1D4ED8">v8 GQA pack</text>
    <text x="218" y="208" font-size="13" fill="#374151">8.6× at G=8</text>
    <circle cx="361" cy="189" r="5" fill="#F59E0B"></circle>
  </g>
  <g>
    <rect x="208" y="224" width="168" height="42" rx="8" fill="#EFF6FF" stroke="#93C5FD"></rect>
    <text x="218" y="241" font-size="14" font-weight="700" fill="#1D4ED8">v8.7 score-st.</text>
    <text x="218" y="258" font-size="13" fill="#374151">1.1–1.6×; recurrence out</text>
    <circle cx="361" cy="239" r="5" fill="#22C55E"></circle>
  </g>

  
  <text x="396" y="60" font-size="15" font-weight="700" fill="#B45309">3 · Precision</text>
  <g>
    <rect x="396" y="74" width="168" height="42" rx="8" fill="#FEF3E4" stroke="#FCD34D"></rect>
    <text x="406" y="91" font-size="14" font-weight="700" fill="#B45309">v9 FP8 KV</text>
    <text x="406" y="108" font-size="13" fill="#374151">1.3×; capacity+accuracy</text>
    <circle cx="549" cy="89" r="5" fill="#EF4444"></circle>
  </g>
  <g>
    <rect x="396" y="124" width="168" height="42" rx="8" fill="#FEF3E4" stroke="#FCD34D"></rect>
    <text x="406" y="141" font-size="14" font-weight="700" fill="#B45309">v10 NVFP4</text>
    <text x="406" y="158" font-size="13" fill="#374151">3.56× capacity; no latency</text>
    <circle cx="549" cy="139" r="5" fill="#F59E0B"></circle>
  </g>

  
  <text x="584" y="60" font-size="15" font-weight="700" fill="#15803D">4 · Shape + engine</text>
  <g>
    <rect x="584" y="74" width="168" height="42" rx="8" fill="#F0FDF4" stroke="#86EFAC"></rect>
    <text x="594" y="91" font-size="14" font-weight="700" fill="#15803D">v11 MLA</text>
    <text x="594" y="108" font-size="13" fill="#374151">M=128; still per-CTA</text>
    <circle cx="737" cy="89" r="5" fill="#EF4444"></circle>
  </g>
  <g>
    <rect x="584" y="124" width="168" height="42" rx="8" fill="#F0FDF4" stroke="#86EFAC"></rect>
    <text x="594" y="141" font-size="14" font-weight="700" fill="#15803D">v12 tcgen05</text>
    <text x="594" y="158" font-size="13" fill="#374151">2.4→1785; work-starvation</text>
    <circle cx="737" cy="139" r="5" fill="#22C55E"></circle>
  </g>

  
  <circle cx="26" cy="343" r="5" fill="#22C55E"></circle>
  <text x="37" y="348" font-size="13" fill="#374151">roofline landed</text>
  <circle cx="166" cy="343" r="5" fill="#F59E0B"></circle>
  <text x="177" y="348" font-size="13" fill="#374151">partial</text>
  <circle cx="256" cy="343" r="5" fill="#EF4444"></circle>
  <text x="267" y="348" font-size="13" fill="#374151">missed (per-CTA layer corrected it)</text>
</svg>