<svg width="100%" viewBox="0 0 920 340" role="img" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<title>v12: MLA decode throughput scales with total work B×K on B300/sm_103a</title>
<desc>The paper's central measured figure. FP8 tcgen05 (CUTLASS ex77) throughput on B300/sm_103a vs total work B×K for MLA decode (H=128, D_latent=512, D_rope=64). At B=1/K≤32K, throughput is 1–2% of the 5 PF FP8 peak (work-starved). At B=64/K=524K, it reaches 1785 TFLOP/s = 35.7% FP8 peak / 46.3% HBM. v11's CUDA-core kernel was flat at 0.75 TFLOP/s regardless of work — the ENGINE is the lever.</desc>
<rect x="0" y="0" width="920" height="340" fill="#ffffff"/>

<text x="30" y="28" font-size="14" font-weight="600" fill="#2C2C2A">v12: MLA decode throughput scales with total work B×K</text>
<text x="30" y="46" font-size="10.5" fill="#888780">B300/sm_103a · CUTLASS ex77 tcgen05 · FP8 E4M3 · DeepSeek shape (H=128, D_latent=512, D_rope=64, N_q=1)</text>

<!-- Data table (reference for the paper) -->
<text x="30" y="74" font-size="10" font-weight="600" fill="#2C2C2A">B=1 (single-stream decode)</text>
<text x="42" y="90" font-size="9" fill="#555">K=256: 2.4 TF (0.05% peak) · K=8K: 51.4 TF (1.0%) · K=32K: 112.5 TF (2.2%) · K=131K: 295.3 TF (5.9%) · K=524K: 790.6 TF (15.8%)</text>

<text x="30" y="112" font-size="10" font-weight="600" fill="#2C2C2A">B=64 (serving batch)</text>
<text x="42" y="128" font-size="9" fill="#555">K=1K: 232.2 TF (4.6%) · K=8K: 944.8 TF (18.9%) · K=32K: 1472.6 TF (29.5%) · K=131K: 1717.3 TF (34.3%) · K=524K: 1785.3 TF (35.7%)</text>

<!-- Reference lines -->
<text x="30" y="156" font-size="10" font-weight="600" fill="#2C2C2A">Reference</text>
<text x="42" y="172" font-size="9" fill="#555">FP8 peak: 5000 TFLOP/s · HBM peak: 8 TB/s · v11 CUDA-core: 0.75 TFLOP/s (flat) · FP16 tracks FP8 → not compute-bound</text>

<!-- Visual bar chart (simplified for SVG portability) -->
<text x="30" y="202" font-size="10" font-weight="600" fill="#2C2C2A">Achieved % of FP8 peak (5 PF)</text>

<!-- B=1 bars -->
<rect x="42" y="210" width="2" height="12" rx="1" fill="#3B82F6"/>
<text x="50" y="220" font-size="8" fill="#555">K=256 (0.05%)</text>
<rect x="42" y="226" width="18" height="12" rx="1" fill="#3B82F6"/>
<text x="66" y="236" font-size="8" fill="#555">K=8K (1.0%)</text>
<rect x="42" y="242" width="40" height="12" rx="1" fill="#3B82F6"/>
<text x="88" y="252" font-size="8" fill="#555">K=32K (2.2%)</text>
<rect x="42" y="258" width="106" height="12" rx="1" fill="#3B82F6"/>
<text x="154" y="268" font-size="8" fill="#555">K=131K (5.9%)</text>
<rect x="42" y="274" width="284" height="12" rx="1" fill="#3B82F6"/>
<text x="332" y="284" font-size="8" fill="#555">K=524K (15.8%)</text>

<!-- B=64 bars -->
<rect x="42" y="296" width="83" height="12" rx="1" fill="#EF4444"/>
<text x="131" y="306" font-size="8" fill="#555">B=64, K=1K (4.6%)</text>
<rect x="42" y="312" width="340" height="12" rx="1" fill="#EF4444"/>
<text x="388" y="322" font-size="8" fill="#555">B=64, K=8K (18.9%)</text>

<!-- v11 reference line -->
<line x1="42" y1="208" x2="42" y2="330" stroke="#F59E0B" stroke-width="1" stroke-dasharray="3,2"/>
<text x="38" y="338" font-size="7" fill="#D97706" text-anchor="end">v11: 0.75 TF</text>

<!-- Legend -->
<rect x="500" y="296" width="8" height="8" rx="1" fill="#3B82F6"/>
<text x="512" y="304" font-size="9" fill="#555">B=1</text>
<rect x="540" y="296" width="8" height="8" rx="1" fill="#EF4444"/>
<text x="552" y="304" font-size="9" fill="#555">B=64</text>
<rect x="590" y="296" width="8" height="8" rx="1" fill="#F59E0B"/>
<text x="602" y="304" font-size="9" fill="#555">v11 CUDA-core (flat)</text>

<!-- Key finding -->
<rect x="500" y="210" width="390" height="72" rx="6" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1"/>
<text x="514" y="230" font-size="10" font-weight="600" fill="#1E40AF">Central correction (v6→v11 reading):</text>
<text x="514" y="246" font-size="9" fill="#1E3A5F">"Per-CTA-bound forever" was a small-B×K artifact.</text>
<text x="514" y="258" font-size="9" fill="#1E3A5F">The right engine converts work to throughput:</text>
<text x="514" y="270" font-size="9" fill="#1E3A5F">0.75 → 1785 TFLOP/s (2380× span, same shape).</text>
</svg>
