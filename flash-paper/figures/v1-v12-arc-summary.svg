<svg width="100%" viewBox="0 0 760 360" role="img" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<title>The v1 to v12 arc in four phases</title>
<desc>Twelve single-variable kernel steps in four phases: prefill schedule (v1-v5), decode schedule (v6-v8.7), precision (v9-v10), and shape+engine (v11-v12). Dot color marks the pure-roofline verdict: green landed, amber partial, red missed and was corrected by the per-CTA layer.</desc>
<rect x="0" y="0" width="760" height="360" fill="#ffffff"/>

<text x="24" y="30" font-size="22" font-weight="700" fill="#2C2C2A">The v1&#8594;v12 arc: four phases, one variable each</text>

<!-- Phase headers -->
<text x="20"  y="60" font-size="15" font-weight="700" fill="#6D28D9">1. Prefill schedule</text>
<text x="205" y="60" font-size="15" font-weight="700" fill="#1E40AF">2. Decode schedule</text>
<text x="390" y="60" font-size="15" font-weight="700" fill="#B45309">3. Precision</text>
<text x="575" y="60" font-size="15" font-weight="700" fill="#166534">4. Shape + engine</text>

<!-- ==== helper: chip = rect(w170,h40) + version + takeaway + dot ==== -->
<!-- Phase 1 col x=20 -->
<g font-family="Helvetica, Arial, sans-serif">
<!-- v1 -->
<rect x="20" y="72" width="172" height="40" rx="6" fill="#F5F3FF" stroke="#C4B5FD"/>
<text x="32" y="90" font-size="15" font-weight="700" fill="#4C1D95">v1 naive</text>
<text x="32" y="107" font-size="13" fill="#555">HBM-bound; L2 masks it</text>
<circle cx="180" cy="82" r="5" fill="#F59E0B"/>
<!-- v2 -->
<rect x="20" y="118" width="172" height="40" rx="6" fill="#F5F3FF" stroke="#C4B5FD"/>
<text x="32" y="136" font-size="15" font-weight="700" fill="#4C1D95">v2 tiled</text>
<text x="32" y="153" font-size="13" fill="#555">3&#215; faster; 0% DRAM cut</text>
<circle cx="180" cy="128" r="5" fill="#EF4444"/>
<!-- v3 -->
<rect x="20" y="164" width="172" height="40" rx="6" fill="#F5F3FF" stroke="#C4B5FD"/>
<text x="32" y="182" font-size="15" font-weight="700" fill="#4C1D95">v3 online</text>
<text x="32" y="199" font-size="13" fill="#555">S gone; 3&#8211;7&#215; slower</text>
<circle cx="180" cy="174" r="5" fill="#EF4444"/>
<!-- v4 -->
<rect x="20" y="210" width="172" height="40" rx="6" fill="#F5F3FF" stroke="#C4B5FD"/>
<text x="32" y="228" font-size="15" font-weight="700" fill="#4C1D95">v4 fused</text>
<text x="32" y="245" font-size="13" fill="#555">1.7&#8211;2.6&#215;; GEMV wall</text>
<circle cx="180" cy="220" r="5" fill="#EF4444"/>
<!-- v5 -->
<rect x="20" y="256" width="172" height="40" rx="6" fill="#F5F3FF" stroke="#C4B5FD"/>
<text x="32" y="274" font-size="15" font-weight="700" fill="#4C1D95">v5 WMMA</text>
<text x="32" y="291" font-size="13" fill="#555">predicted, not measured</text>
<circle cx="180" cy="266" r="5" fill="#9CA3AF"/>
</g>

<!-- Phase 2 col x=205 -->
<g>
<rect x="205" y="72" width="172" height="40" rx="6" fill="#EFF6FF" stroke="#93C5FD"/>
<text x="217" y="90" font-size="15" font-weight="700" fill="#1E3A8A">v6 split-KV</text>
<text x="217" y="107" font-size="13" fill="#555">5.7&#8211;8.2&#215;; per-CTA</text>
<circle cx="365" cy="82" r="5" fill="#EF4444"/>
<rect x="205" y="118" width="172" height="40" rx="6" fill="#EFF6FF" stroke="#93C5FD"/>
<text x="217" y="136" font-size="15" font-weight="700" fill="#1E3A8A">v7 paged</text>
<text x="217" y="153" font-size="13" fill="#555">flat %HBM, all batch</text>
<circle cx="365" cy="128" r="5" fill="#EF4444"/>
<rect x="205" y="164" width="172" height="40" rx="6" fill="#EFF6FF" stroke="#93C5FD"/>
<text x="217" y="182" font-size="15" font-weight="700" fill="#1E3A8A">v8 GQA pack</text>
<text x="217" y="199" font-size="13" fill="#555">8.6&#215; at G=8</text>
<circle cx="365" cy="174" r="5" fill="#F59E0B"/>
<rect x="205" y="210" width="172" height="40" rx="6" fill="#EFF6FF" stroke="#93C5FD"/>
<text x="217" y="228" font-size="15" font-weight="700" fill="#1E3A8A">v8.7 score-st.</text>
<text x="217" y="245" font-size="13" fill="#555">1.1&#8211;1.6&#215;; recurrence out</text>
<circle cx="365" cy="220" r="5" fill="#22C55E"/>
</g>

<!-- Phase 3 col x=390 -->
<g>
<rect x="390" y="72" width="172" height="40" rx="6" fill="#FEF3E4" stroke="#FBBF77"/>
<text x="402" y="90" font-size="15" font-weight="700" fill="#92400E">v9 FP8 KV</text>
<text x="402" y="107" font-size="13" fill="#555">1.3&#215;; capacity+accuracy</text>
<circle cx="550" cy="82" r="5" fill="#EF4444"/>
<rect x="390" y="118" width="172" height="40" rx="6" fill="#FEF3E4" stroke="#FBBF77"/>
<text x="402" y="136" font-size="15" font-weight="700" fill="#92400E">v10 NVFP4</text>
<text x="402" y="153" font-size="13" fill="#555">3.56&#215; capacity; no lat.</text>
<circle cx="550" cy="128" r="5" fill="#F59E0B"/>
</g>

<!-- Phase 4 col x=575 -->
<g>
<rect x="575" y="72" width="172" height="40" rx="6" fill="#F0FDF4" stroke="#86EFAC"/>
<text x="587" y="90" font-size="15" font-weight="700" fill="#166534">v11 MLA</text>
<text x="587" y="107" font-size="13" fill="#555">M=128; still per-CTA</text>
<circle cx="735" cy="82" r="5" fill="#EF4444"/>
<rect x="575" y="118" width="172" height="40" rx="6" fill="#F0FDF4" stroke="#86EFAC"/>
<text x="587" y="136" font-size="15" font-weight="700" fill="#166534">v12 tcgen05</text>
<text x="587" y="153" font-size="13" fill="#555">2.4&#8594;1785; work-starved</text>
<circle cx="735" cy="128" r="5" fill="#22C55E"/>
</g>

<!-- legend -->
<circle cx="34" cy="330" r="5" fill="#22C55E"/><text x="46" y="335" font-size="13" fill="#555">roofline landed</text>
<circle cx="190" cy="330" r="5" fill="#F59E0B"/><text x="202" y="335" font-size="13" fill="#555">partial</text>
<circle cx="300" cy="330" r="5" fill="#EF4444"/><text x="312" y="335" font-size="13" fill="#555">missed (per-CTA layer corrected it)</text>
</svg>
