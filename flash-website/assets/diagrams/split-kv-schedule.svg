<svg width="100%" viewBox="0 0 680 410" role="img" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<title>FlashAttention-4 grid versus split-KV decode schedule</title>
<desc>Top: FlashAttention-4's decode grid is one CTA per query that reads the whole KV cache serially, leaving about 147 of the 160 SMs idle. Bottom: split-KV divides the KV cache into chunks across all SMs; each SM computes a partial softmax statistic, and a log-sum-exp merge combines them into the output.</desc>
<rect x="0" y="0" width="680" height="410" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="45" y="48" font-size="12" fill="#5F5E5A">FA4 — grid (1, heads, batch): one CTA reads all of it</text>
<rect x="150" y="64" width="414" height="34" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="357" y="85" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">KV cache</text>
<line x1="182" y1="118" x2="182" y2="100" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="150" y="118" width="64" height="30" rx="4" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="182" y="137" font-size="12" fill="#185FA5" text-anchor="middle">SM 0</text>
<rect x="224" y="118" width="64" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<rect x="298" y="118" width="64" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<rect x="372" y="118" width="64" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<rect x="446" y="118" width="64" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<rect x="520" y="118" width="64" height="30" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="430" y="166" font-size="12" fill="#5F5E5A" text-anchor="middle">≈ 147 SMs idle</text>
<text x="45" y="208" font-size="12" fill="#5F5E5A">split-KV — KV cache divided across all 160 SMs</text>
<rect x="150" y="226" width="78" height="34" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<rect x="234" y="226" width="78" height="34" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<rect x="318" y="226" width="78" height="34" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<rect x="402" y="226" width="78" height="34" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<rect x="486" y="226" width="78" height="34" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<line x1="189" y1="262" x2="189" y2="284" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="273" y1="262" x2="273" y2="284" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="357" y1="262" x2="357" y2="284" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="441" y1="262" x2="441" y2="284" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="525" y1="262" x2="525" y2="284" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="150" y="286" width="78" height="30" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="189" y="305" font-size="12" fill="#0F6E56" text-anchor="middle">partial</text>
<rect x="234" y="286" width="78" height="30" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="273" y="305" font-size="12" fill="#0F6E56" text-anchor="middle">partial</text>
<rect x="318" y="286" width="78" height="30" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="357" y="305" font-size="12" fill="#0F6E56" text-anchor="middle">partial</text>
<rect x="402" y="286" width="78" height="30" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="441" y="305" font-size="12" fill="#0F6E56" text-anchor="middle">partial</text>
<rect x="486" y="286" width="78" height="30" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="525" y="305" font-size="12" fill="#0F6E56" text-anchor="middle">partial</text>
<line x1="189" y1="316" x2="320" y2="350" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="273" y1="316" x2="330" y2="350" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="357" y1="316" x2="345" y2="350" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="441" y1="316" x2="360" y2="350" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="525" y1="316" x2="372" y2="350" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="235" y="352" width="200" height="34" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="335" y="373" font-size="14" font-weight="500" fill="#3C3489" text-anchor="middle">log-sum-exp merge</text>
<line x1="435" y1="369" x2="468" y2="369" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="470" y="352" width="80" height="34" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="510" y="373" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">output O</text>
</svg>
