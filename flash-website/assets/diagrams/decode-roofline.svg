<svg width="100%" viewBox="0 0 680 430" role="img" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<title>Decode attention roofline on NVIDIA B300</title>
<desc>A log-log roofline. The diagonal is the 8 TB/s HBM bandwidth bound; the flat ceiling is the 15 PFLOP FP4 compute peak; they meet at a ridge near arithmetic intensity 1875. Decode attention with an FP4 KV cache sits at intensity around 3.5, far left in the memory-bound region, roughly 500 times below the ridge. Adding GQA raises intensity to about 30, and MLA pushes it toward the ridge into the compute-bound region where FlashAttention-4 operates.</desc>
<rect x="0" y="0" width="680" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<line x1="90" y1="70" x2="90" y2="380" stroke="#888780" stroke-width="0.5"/>
<line x1="90" y1="380" x2="645" y2="380" stroke="#888780" stroke-width="0.5"/>
<text x="86" y="60" font-size="12" fill="#5F5E5A">throughput (FLOP/s, log)</text>
<text x="645" y="402" font-size="12" fill="#5F5E5A" text-anchor="end">arithmetic intensity (FLOP/byte, log)</text>
<line x1="110" y1="360" x2="560" y2="92" stroke="#185FA5" stroke-width="1.5"/>
<line x1="560" y1="92" x2="645" y2="92" stroke="#185FA5" stroke-width="1.5"/>
<line x1="560" y1="92" x2="560" y2="380" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="4 3"/>
<text x="640" y="84" font-size="12" fill="#5F5E5A" text-anchor="end">FP4 peak · 15 PF</text>
<text x="566" y="210" font-size="12" fill="#5F5E5A">ridge AI*≈1875</text>
<circle cx="150" cy="333" r="5" fill="#D85A30"/>
<text x="163" y="330" font-size="14" fill="#2C2C2A">decode, FP4 KV — AI≈3.5</text>
<circle cx="335" cy="226" r="5" fill="#D85A30"/>
<text x="348" y="223" font-size="14" fill="#2C2C2A">+ GQA-8 — AI≈30</text>
<circle cx="500" cy="128" r="5" fill="#1D9E75"/>
<text x="492" y="116" font-size="14" fill="#2C2C2A" text-anchor="end">+ MLA — AI → ridge</text>
<text x="158" y="373" font-size="12" fill="#5F5E5A" text-anchor="middle">memory-bound (you are here)</text>
<text x="601" y="365" font-size="12" fill="#5F5E5A" text-anchor="middle">compute-bound · FA4</text>
</svg>
