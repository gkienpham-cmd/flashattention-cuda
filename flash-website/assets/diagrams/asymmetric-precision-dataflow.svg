<svg width="100%" viewBox="0 0 680 360" role="img" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<title>Asymmetric-precision decode attention dataflow</title>
<desc>Inputs Q, K, V flow into two matmuls with opposite precision needs. The score matmul Q times K-transpose runs in MXFP8 with outlier protection, then softmax runs in FP32 on hardware exp2 — both are precision-critical (coral). The result P is quantized with two-level FP4 scaling, then the P times V matmul runs in NVFP4 with FP32 accumulation, producing output O — these are FP4-safe (teal). The KV cache is stored in NVFP4 for roughly 3.5 times fewer bytes.</desc>
<rect x="0" y="0" width="680" height="360" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<line x1="142" y1="162" x2="178" y2="98" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="142" y1="184" x2="178" y2="250" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="317" y1="95" x2="348" y2="95" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="427" y1="122" x2="427" y2="233" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="348" y1="260" x2="317" y2="260" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="178" y1="260" x2="142" y2="260" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="45" y="148" width="95" height="50" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="92" y="170" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">Q, K, V</text>
<text x="92" y="187" font-size="12" fill="#5F5E5A" text-anchor="middle">inputs</text>
<rect x="180" y="70" width="137" height="50" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="248" y="92" font-size="14" font-weight="500" fill="#712B13" text-anchor="middle">Q·Kᵀ → S</text>
<text x="248" y="109" font-size="12" fill="#993C1D" text-anchor="middle">MXFP8 + outliers</text>
<rect x="350" y="70" width="155" height="50" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="427" y="92" font-size="14" font-weight="500" fill="#712B13" text-anchor="middle">softmax → P</text>
<text x="427" y="109" font-size="12" fill="#993C1D" text-anchor="middle">FP32 hardware exp2</text>
<rect x="350" y="235" width="155" height="50" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="427" y="257" font-size="14" font-weight="500" fill="#085041" text-anchor="middle">quantize P</text>
<text x="427" y="274" font-size="12" fill="#0F6E56" text-anchor="middle">two-level FP4</text>
<rect x="180" y="235" width="137" height="50" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="248" y="257" font-size="14" font-weight="500" fill="#085041" text-anchor="middle">P · V</text>
<text x="248" y="274" font-size="12" fill="#0F6E56" text-anchor="middle">NVFP4 · FP32 accum</text>
<rect x="45" y="235" width="95" height="50" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="92" y="257" font-size="14" font-weight="500" fill="#444441" text-anchor="middle">output O</text>
<text x="92" y="274" font-size="12" fill="#5F5E5A" text-anchor="middle">to next layer</text>
<rect x="45" y="312" width="13" height="13" rx="2" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="64" y="322" font-size="12" fill="#5F5E5A">precision-critical (≥ MXFP8 / FP32)</text>
<rect x="360" y="312" width="13" height="13" rx="2" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="379" y="322" font-size="12" fill="#5F5E5A">FP4-safe — KV cache in NVFP4</text>
</svg>
