<text x="560" y="286" font-size="8" fill="#A8A29E" text-anchor="middle">0%</text>
<text x="720" y="286" font-size="8" fill="#A8A29E" text-anchor="middle">50%</text>
<text x="880" y="286" font-size="8" fill="#A8A29E" text-anchor="middle">100%</text>

<!-- FP8 bar: 21.7% of 320px = 69.4px -->
<rect x="560" y="128" width="69" height="34" rx="3" fill="#E0A458"/>
<text x="566" y="122" font-size="9.5" fill="#57534E" font-weight="600">FP8 (E4M3)</text>
<text x="636" y="150" font-size="11" fill="#B77F32" font-weight="700">21.7%</text>
<text x="700" y="150" font-size="9" fill="#A8A29E">of 5 PF</text>

<!-- FP4 bar: 5.8% of 320px = 18.6px -->
<rect x="560" y="196" width="19" height="34" rx="3" fill="#6D74C0"/>
<text x="566" y="190" font-size="9.5" fill="#57534E" font-weight="600">FP4 (NVFP4)</text>
<text x="586" y="218" font-size="11" fill="#565CAB" font-weight="700">5.8%</text>
<text x="640" y="218" font-size="9" fill="#A8A29E">of 15 PF</text>

<text x="560" y="256" font-size="9" fill="#78716C" font-style="italic">Both are single-digit-to-low-double-digit fractions —</text>
<text x="560" y="268" font-size="9" fill="#78716C" font-style="italic">the compute peak is never the operative limit.</text>

<!-- ===================== verdict strip ===================== -->
<rect x="30" y="360" width="860" height="66" rx="6" fill="#FBF3EA" stroke="#E0A458" stroke-width="1.1"/>
<text x="46" y="382" font-size="10.5" font-weight="700" fill="#8A5E22">Verdict — the M=128 packing gate is a red herring for decode</text>
<text x="46" y="400" font-size="9.5" fill="#57534E">Decode AI (100–176) sits far below both ridges (625 / 1875), so FP4 and FP8 GEMMs are HBM-bound at every N. Native FP4 <tspan font-style="italic">compute</tspan> never reaches its 15 PF peak →</text>
<text x="46" y="415" font-size="9.5" fill="#57534E">it can't accelerate decode. Any FP4 edge is a bandwidth / operand-size effect — the KV-capacity lever of v9/v10, not a compute win. FP4/NVFP4 = capacity + accuracy, not latency.</text>

<!-- footnote -->
<text x="30" y="446" font-size="8" fill="#A8A29E">Cross-harness: FP4 = CUTLASS example 72a (block-scaled NVFP4→bf16); FP8 = cuBLAS E4M3 via torch._scaled_mm. KILL rests on peak-fraction + roofline (AI ≪ ridge caps FP4 regardless of tuning), not the raw ratio.</text>
<text x="30" y="459" font-size="8" fill="#A8A29E">Peaks shown @ K=576, N=131072. Single seed, clocks not locked (far from any threshold that would move a peak-fraction verdict). Data: notebooks/stage_a_results.csv · docs/stage-a-results.md.</text>
</svg>
