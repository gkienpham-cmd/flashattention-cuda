<svg width="100%" viewBox="0 0 700 350" role="img" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<title>GQA M-packing turns the decode GEMV into a small GEMM</title>
<desc>Left: v6 and v7 process each query head separately, so the score matmul Q-head times K-transpose has M equal to 1 (a GEMV), tensor cores idle, and the shared KV is read G times — once per head in the group. Arithmetic intensity stays 2 over b. Right: v8 packs the G query heads that share one KV head into the M dimension, so the matmul becomes an M-equals-G small GEMM, tensor cores engage, and the KV is read once for all G heads. Arithmetic intensity rises to 2G over b. The math: FLOPs equal 4 G N d, bytes equal 2 N d b because KV is shared, so AI equals 2G over b. For a group of 8, BF16 gives AI 8 and NVFP4 gives about 28.6.</desc>
<rect x="0" y="0" width="700" height="350" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<line x1="350" y1="36" x2="350" y2="232" stroke="#E2E0D8" stroke-width="1"/>
<!-- ============ LEFT: per-head GEMV ============ -->
<text x="40" y="52" font-size="13" font-weight="500" fill="#712B13">v6 / v7 — per-head GEMV  (M = 1, ×G calls)</text>
<!-- Qh thin row, with faded stack -->
<rect x="44" y="96" width="66" height="10" rx="2" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
<rect x="48" y="90" width="66" height="10" rx="2" fill="#F7F5EF" stroke="#CFCDC4" stroke-width="0.5"/>
<rect x="52" y="84" width="66" height="10" rx="2" fill="#FBFAF6" stroke="#DAD8CF" stroke-width="0.5"/>
<text x="85" y="124" font-size="11" fill="#5F5E5A" text-anchor="middle">Qₕ · 1×d</text>
<text x="128" y="92" font-size="13" fill="#5F5E5A">·</text>
<!-- Kt tall, faded stack = read G times -->
<rect x="150" y="82" width="58" height="48" rx="2" fill="#FAECE7" stroke="#993C1D" stroke-width="0.6"/>
<rect x="155" y="77" width="58" height="48" rx="2" fill="#FCF2EE" stroke="#C98C76" stroke-width="0.5"/>
<rect x="160" y="72" width="58" height="48" rx="2" fill="#FDF7F4" stroke="#D9B3A4" stroke-width="0.5"/>
<text x="186" y="146" font-size="11" fill="#993C1D" text-anchor="middle">Kᵀ (KV) · read G×</text>
<line x1="224" y1="96" x2="252" y2="96" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#arrow)"/>
<!-- scores thin -->
<rect x="256" y="96" width="60" height="10" rx="2" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
<rect x="260" y="90" width="60" height="10" rx="2" fill="#F7F5EF" stroke="#CFCDC4" stroke-width="0.5"/>
<text x="288" y="124" font-size="11" fill="#5F5E5A" text-anchor="middle">s · 1×N</text>
<text x="44" y="178" font-size="12" fill="#2C2C2A">AI = 2/b · tensor cores idle (&lt;1% MMA)</text>
<text x="44" y="196" font-size="12" fill="#993C1D">KV tile read G× — wasted bandwidth</text>
<!-- ============ RIGHT: M-packed GEMM ============ -->
<text x="392" y="52" font-size="13" font-weight="500" fill="#085041">v8 — GQA M-packing  (M = G GEMM)</text>
<!-- Q group G rows -->
<rect x="396" y="78" width="66" height="50" rx="2" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.7"/>
<line x1="396" y1="90" x2="462" y2="90" stroke="#0F6E56" stroke-width="0.3"/>
<line x1="396" y1="102" x2="462" y2="102" stroke="#0F6E56" stroke-width="0.3"/>
<line x1="396" y1="114" x2="462" y2="114" stroke="#0F6E56" stroke-width="0.3"/>
<text x="429" y="144" font-size="11" fill="#085041" text-anchor="middle">Q_grp · G×d</text>
<text x="472" y="106" font-size="13" fill="#5F5E5A">·</text>
<!-- Kt shared, single bold -->
<rect x="492" y="78" width="58" height="50" rx="2" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.4"/>
<text x="521" y="144" font-size="11" fill="#085041" text-anchor="middle">Kᵀ (KV) · once</text>
<line x1="556" y1="103" x2="582" y2="103" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#arrow)"/>
<!-- scores G rows -->
<rect x="586" y="78" width="56" height="50" rx="2" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.7"/>
<line x1="586" y1="90" x2="642" y2="90" stroke="#0F6E56" stroke-width="0.3"/>
<line x1="586" y1="102" x2="642" y2="102" stroke="#0F6E56" stroke-width="0.3"/>
<line x1="586" y1="114" x2="642" y2="114" stroke="#0F6E56" stroke-width="0.3"/>
<text x="614" y="144" font-size="11" fill="#085041" text-anchor="middle">S · G×N</text>
<text x="392" y="178" font-size="12" fill="#2C2C2A">AI = 2G/b · tensor cores engage (M=G)</text>
<text x="392" y="196" font-size="12" fill="#0F6E56">KV tile read once for all G heads</text>
<!-- ============ math box ============ -->
<rect x="44" y="246" width="612" height="74" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.6"/>
<text x="350" y="272" font-size="14" fill="#3C3489" text-anchor="middle" font-weight="500">FLOPs = 4·G·N·d   ·   bytes = 2·N·d·b  (KV shared)   ⟹   AI = 4GNd / 2Ndb = 2G/b</text>
<text x="350" y="298" font-size="13" fill="#2C2C2A" text-anchor="middle">GQA-8 BF16 = 8.0   ·   GQA-8 NVFP4 ≈ 28.6   —   still ≪ B300 FP4 ridge 1875 ⟹ memory-bound (shape win, not compute win)</text>
</svg>
