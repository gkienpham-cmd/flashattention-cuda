<svg width="100%" viewBox="0 0 680 500" role="img" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<title>Staged build plan from v6 to v11 toward a B300 decode kernel</title>
<desc>Six stages. v6 split-KV decode and v7 paged KV gather develop on a cheap T4 or rented GPU. v8 FP8 KV cache is the first B300 rental milestone. v9 NVFP4 plus asymmetric precision is the headline B300 milestone that targets beating FA4. v10 adds GQA M-packing and B300 retuning. v11 is a stretch goal of MLA or speculative decode.</desc>
<rect x="0" y="0" width="680" height="500" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="70" y="46" width="540" height="52" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="88" y="70" font-size="14" font-weight="500" fill="#444441">v6 — split-KV decode (FP16)</text>
<text x="88" y="88" font-size="12" fill="#5F5E5A">decode roofline + log-sum-exp merge · T4 or rented</text>
<line x1="110" y1="98" x2="110" y2="112" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="70" y="114" width="540" height="52" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="88" y="138" font-size="14" font-weight="500" fill="#444441">v7 — paged KV gather</text>
<text x="88" y="156" font-size="12" fill="#5F5E5A">block-table indirection into smem · T4 or rented</text>
<line x1="110" y1="166" x2="110" y2="180" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="70" y="182" width="540" height="52" rx="4" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="88" y="206" font-size="14" font-weight="500" fill="#0C447C">v8 — FP8 KV cache</text>
<text x="88" y="224" font-size="12" fill="#185FA5">first precision cut, inline dequant · rent B300 #1</text>
<line x1="110" y1="234" x2="110" y2="248" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="70" y="250" width="540" height="52" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="88" y="274" font-size="14" font-weight="500" fill="#712B13">v9 — NVFP4 + asymmetric precision</text>
<text x="88" y="292" font-size="12" fill="#993C1D">the headline: ~3.5× fewer bytes, target beating FA4 · B300</text>
<line x1="110" y1="302" x2="110" y2="316" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="70" y="318" width="540" height="52" rx="4" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="88" y="342" font-size="14" font-weight="500" fill="#0C447C">v10 — GQA M-packing + B300 retune</text>
<text x="88" y="360" font-size="12" fill="#185FA5">GEMV→GEMM, drop ex2_emu, 160 SMs · B300</text>
<line x1="110" y1="370" x2="110" y2="384" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="70" y="386" width="540" height="52" rx="4" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="88" y="410" font-size="14" font-weight="500" fill="#0C447C">v11 — MLA / speculative decode (stretch)</text>
<text x="88" y="428" font-size="12" fill="#185FA5">raise arithmetic intensity toward the ridge · B300</text>
<rect x="70" y="462" width="13" height="13" rx="2" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="89" y="472" font-size="12" fill="#5F5E5A">develop cheap (T4 / rented)</text>
<rect x="290" y="462" width="13" height="13" rx="2" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="309" y="472" font-size="12" fill="#5F5E5A">B300 milestone</text>
<rect x="450" y="462" width="13" height="13" rx="2" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="469" y="472" font-size="12" fill="#5F5E5A">headline result</text>
</svg>
