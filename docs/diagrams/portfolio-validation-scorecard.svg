<svg width="100%" viewBox="0 0 960 580" role="img" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<title>Independent Validation — reproduced roofline AIs and literature-checked claims</title>
<desc>An independent review re-ran the project's roofline tool and reproduced every published arithmetic-intensity number exactly (MLA FP16 234.8, MLA FP8 469.7, MLA NVFP4 835.0, GQA-8 3.6), and cross-checked the headline external claims against current literature (B300 hardware constants, decode work-starvation, MLA capacity math, complement-not-beat positioning, and the Grouped Latent Attention closest-prior anchor). Three hardening items were flagged, all previously noted in the project's own logs.</desc>

<defs>
<linearGradient id="vbg" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#0F172A"/>
<stop offset="1" stop-color="#1E293B"/>
</linearGradient>
</defs>

<rect x="0" y="0" width="960" height="580" fill="url(#vbg)"/>

<!-- HEADER -->
<text x="40" y="50" font-size="26" font-weight="700" fill="#F8FAFC">Independent Validation</text>
<text x="40" y="74" font-size="13" fill="#94A3B8">An independent re-run of the roofline tool + a literature cross-check — reproducible from the repo</text>

