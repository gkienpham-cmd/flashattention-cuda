<text x="522" y="318" font-size="10.5" fill="#6EE7B7" font-weight="600">Methodology judged "publication-grade for a characterization venue"</text>

<!-- ===== HARDENING ITEMS ===== -->
<text x="40" y="366" font-size="13" font-weight="700" fill="#FBBF24">Three hardening items — all already flagged in the project's own logs</text>

<rect x="40" y="378" width="286" height="86" rx="8" fill="#241A08" stroke="#3F2D0A"/>
<text x="56" y="400" font-size="10.5" font-weight="600" fill="#FDE68A">1 · The 4× cuBLAS gap</text>
<text x="56" y="418" font-size="9.5" fill="#A8A29E">The gap is measured; the "M=128 is a</text>
<text x="56" y="431" font-size="9.5" fill="#A8A29E">TC GEMM" cause is a structural</text>
<text x="56" y="444" font-size="9.5" fill="#A8A29E">inference — torch baseline unprofiled.</text>
<text x="56" y="458" font-size="9" fill="#78716C" font-style="italic">→ stated as inference throughout</text>

<rect x="337" y="378" width="286" height="86" rx="8" fill="#241A08" stroke="#3F2D0A"/>
<text x="353" y="400" font-size="10.5" font-weight="600" fill="#FDE68A">2 · Blackwell = proxy-grade</text>
<text x="353" y="418" font-size="9.5" fill="#A8A29E">T4 has ncu ground truth; B200/B300</text>
<text x="353" y="431" font-size="9.5" fill="#A8A29E">ran on unprivileged containers (ncu</text>
<text x="353" y="444" font-size="9.5" fill="#A8A29E">blocked). Proxy validated once, on T4.</text>
<text x="353" y="458" font-size="9" fill="#78716C" font-style="italic">→ privileged-box ncu = top open item</text>

<rect x="634" y="378" width="286" height="86" rx="8" fill="#241A08" stroke="#3F2D0A"/>
<text x="650" y="400" font-size="10.5" font-weight="600" fill="#FDE68A">3 · Accuracy is single-seed</text>
<text x="650" y="418" font-size="9.5" fill="#A8A29E">FP8 ~6–7e-4, NVFP4 ~2.4e-3 RMSE,</text>
<text x="650" y="431" font-size="9.5" fill="#A8A29E">~3.5× ratio — one seed per shape on</text>
<text x="650" y="444" font-size="9.5" fill="#A8A29E">a small substrate, not a constant.</text>
<text x="650" y="458" font-size="9" fill="#78716C" font-style="italic">→ labeled single-seed in the doc</text>

<!-- VERDICT STRIP -->
<rect x="40" y="484" width="880" height="66" rx="8" fill="#0D2A20" stroke="#10B981" stroke-width="1.2"/>
<text x="58" y="508" font-size="11" font-weight="700" fill="#A7F3D0">Verdict</text>
<text x="58" y="527" font-size="10.5" fill="#D1FAE5">"The findings are valid. Every claim I could independently check holds up against both the code and the current literature.</text>
<text x="58" y="543" font-size="10.5" fill="#D1FAE5">The honesty about misses is not a weakness — it is the strongest evidence that the wins are real."</text>
</svg>
