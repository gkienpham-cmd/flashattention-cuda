<text x="62" y="75" font-size="11" fill="#444441" text-anchor="middle">q · 1×d</text>
<text x="320" y="50" font-size="11" fill="#5F5E5A" text-anchor="middle">KV cache · N_k keys split into S chunks</text>
<g>
<rect x="132" y="56" width="71" height="30" rx="2" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<rect x="205" y="56" width="71" height="30" rx="2" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<rect x="278" y="56" width="71" height="30" rx="2" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<rect x="351" y="56" width="71" height="30" rx="2" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<rect x="424" y="56" width="71" height="30" rx="2" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="167" y="75" font-size="11" fill="#185FA5" text-anchor="middle">KV₀</text>
<text x="240" y="75" font-size="11" fill="#185FA5" text-anchor="middle">KV₁</text>
<text x="313" y="75" font-size="11" fill="#185FA5" text-anchor="middle">KV₂</text>
<text x="386" y="75" font-size="11" fill="#185FA5" text-anchor="middle">…</text>
<text x="459" y="75" font-size="11" fill="#185FA5" text-anchor="middle">KV_{S-1}</text>
</g>
<line x1="167" y1="86" x2="167" y2="104" stroke="#5F5E5A" stroke-width="1.3" marker-end="url(#arrow)"/>
<line x1="240" y1="86" x2="240" y2="104" stroke="#5F5E5A" stroke-width="1.3" marker-end="url(#arrow)"/>
<line x1="313" y1="86" x2="313" y2="104" stroke="#5F5E5A" stroke-width="1.3" marker-end="url(#arrow)"/>
<line x1="386" y1="86" x2="386" y2="104" stroke="#5F5E5A" stroke-width="1.3" marker-end="url(#arrow)"/>
<line x1="459" y1="86" x2="459" y2="104" stroke="#5F5E5A" stroke-width="1.3" marker-end="url(#arrow)"/>
<g>
<rect x="132" y="106" width="71" height="38" rx="2" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<rect x="205" y="106" width="71" height="38" rx="2" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<rect x="278" y="106" width="71" height="38" rx="2" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<rect x="351" y="106" width="71" height="38" rx="2" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<rect x="424" y="106" width="71" height="38" rx="2" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="167" y="123" font-size="10" fill="#085041" text-anchor="middle">online</text>
<text x="167" y="136" font-size="10" fill="#085041" text-anchor="middle">softmax</text>
<text x="240" y="129" font-size="10" fill="#085041" text-anchor="middle">→(Oₛ,mₛ,ℓₛ)</text>
<text x="313" y="129" font-size="10" fill="#085041" text-anchor="middle">→(Oₛ,mₛ,ℓₛ)</text>
<text x="386" y="129" font-size="10" fill="#085041" text-anchor="middle">…</text>
<text x="459" y="129" font-size="10" fill="#085041" text-anchor="middle">→(Oₛ,mₛ,ℓₛ)</text>
</g>
<text x="34" y="166" font-size="11" fill="#993C1D">choose_splits: S = 8 @2k · 10 @8k/16k  →  64–80 blocks on 40 SMs  (~2/SM, ½ warps idle)</text>
<!-- scratch -->
<line x1="313" y1="144" x2="313" y2="182" stroke="#5F5E5A" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="132" y="184" width="363" height="26" rx="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="313" y="201" font-size="11" fill="#444441" text-anchor="middle">unnormalized partials → scratch  [B, H, N_q, S, ·]</text>
<!-- ===== stage 2 ===== -->
<line x1="313" y1="210" x2="313" y2="236" stroke="#5F5E5A" stroke-width="1.3" marker-end="url(#arrow)"/>
<text x="34" y="232" font-size="13" font-weight="500" fill="#444441">② LSE merge kernel — grid (N_q, BH) = (1, 8): only 8 blocks (under-occupied)</text>
<rect x="132" y="240" width="288" height="92" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.6"/>
<text x="276" y="263" font-size="13" fill="#3C3489" text-anchor="middle">m = maxₛ mₛ</text>
<text x="276" y="285" font-size="13" fill="#3C3489" text-anchor="middle">ℓ = Σₛ e^(mₛ − m) · ℓₛ</text>
<text x="276" y="307" font-size="13" fill="#3C3489" text-anchor="middle">O = ( Σₛ e^(mₛ − m) · Oₛ ) / ℓ</text>
<text x="276" y="325" font-size="10" fill="#5F5E5A" text-anchor="middle">same LSE algebra as online softmax, across splits</text>
<line x1="420" y1="286" x2="452" y2="286" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="456" y="268" width="74" height="36" rx="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.6"/>
<text x="493" y="290" font-size="12" fill="#444441" text-anchor="middle">output O</text>
<!-- overhead callouts -->
<rect x="556" y="92" width="150" height="120" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="0.6"/>
<text x="563" y="110" font-size="11" font-weight="500" fill="#712B13">overhead the roofline</text>
<text x="563" y="124" font-size="11" font-weight="500" fill="#712B13">cannot see:</text>
<text x="563" y="146" font-size="10.5" fill="#993C1D">⚠ 2-kernel launch latency</text>
<text x="563" y="166" font-size="10.5" fill="#993C1D">⚠ per-key warp-shuffle</text>
<text x="575" y="179" font-size="10.5" fill="#993C1D">reduction (GEMV, in ①)</text>
<text x="563" y="199" font-size="10.5" fill="#993C1D">⚠ merge: 8 blocks, every</text>
<text x="575" y="212" font-size="10.5" fill="#993C1D">d-thread recomputes (m,ℓ)</text>
<!-- caption -->
<rect x="34" y="356" width="672" height="34" rx="4" fill="#F7F6F1" stroke="#D9D7CE" stroke-width="0.5"/>
<text x="370" y="377" font-size="12" fill="#444441" text-anchor="middle">prefill (N_q = N_k) → choose_splits = 1 → single block, no merge → reduces to plain attention  (why the square-shape tests pass)</text>
<text x="34" y="416" font-size="11" fill="#5F5E5A">v7 fixes: compute (m,ℓ) once per merge block + broadcast · fuse merge (Blackwell 2-CTA cluster + DSMEM) · pack G heads into ① (GQA)</text>
</svg>
