<svg width="100%" viewBox="0 0 720 470" role="img" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<title>v6 split-KV decode: two-kernel partial plus log-sum-exp merge dataflow</title>
<desc>Stage one, the partial kernel: the single decode query and the KV cache split into S contiguous chunks; each split-block runs v4-style online softmax over its chunk and writes an unnormalized triple O-sub-s, m-sub-s, ell-sub-s to a scratch buffer. choose_splits picks 8 splits at 2K and 10 at 8K or 16K, giving 64 to 80 blocks on the T4's 40 SMs, about 2 per SM with half the warps idle. Stage two, the merge kernel: it reads all S triples, takes the global max m, rescales each partial by exp of m-sub-s minus m, sums the numerators and denominators, and divides once to give the output O. The merge grid is only N_q times BH equals 1 times 8 equals 8 blocks, badly under-occupied. The roofline cannot see this schedule; the overhead lives in the two-kernel launch, the per-key warp-shuffle reduction inside stage one, and the tiny merge. Prefill, where N_q equals N_k, takes 1 split and reduces to plain attention.</desc>
<rect x="0" y="0" width="720" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<!-- ===== stage 1 ===== -->
<text x="34" y="40" font-size="13" font-weight="500" fill="#444441">① partial kernel — split-KV online softmax (one block per chunk × BH)</text>
