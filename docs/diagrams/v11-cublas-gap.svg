<rect x="30" y="320" width="660" height="34" rx="5" fill="#F1EFFA" stroke="#9B92D8" stroke-width="1.1"/>
<text x="44" y="341" font-size="10.5" fill="#3C3489">~4× slower — the M=128 shape is tensor-core-friendly; CUDA cores are the wrong tool → v12 = tcgen05.</text>
