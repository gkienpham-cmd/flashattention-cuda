<svg width="100%" viewBox="0 0 720 372" role="img" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<title>The 4x gap: CUDA-core warp-per-head GEMV vs torch dense-MQA at M=128 on B300/sm_103</title>
<desc>B300/sm_103 measurement of the real MLA shape DQK=576, DV=512, h_q=128. Left: a bar chart of vs_sdpa (our CUDA-core MLA kernel time relative to torch dense-MQA) at three context lengths — N_k=2048 gives 0.29x, N_k=8192 gives 0.24x, N_k=16384 gives 0.23x, all below the dashed red 1.0x break-even line, so the kernel is 3.4 to 4.3 times SLOWER than torch and it worsens as N_k grows. Achieved 0.75 TFLOP/s is under 1 percent of either compute peak and %HBM is ~0%, so the kernel is neither bandwidth- nor compute-saturated: a per-CTA / low-MLP floor. Right: the two execution paths. torch packs the M=128 query heads into one batched cuBLAS GEMM that runs on tensor cores; our hand-written kernel runs warp-per-head CUDA-core GEMV (16 row-tiles times 8 warps), tensor cores idle. The cause is an inference, not a torch-side profile: no torch profile was captured, but "torch hits one M=128 tensor-core GEMM" is a strong externally-corroborated explanation; the established fact is the ~4x slowdown. The honest takeaway: a ~4x loss to a tensor-core path is exactly what a tensor-core-friendly shape looks like — the MLA M=128 shape is structurally a real GEMM, so the next step (v12) is to put M=128 on tcgen05 (native FP4 / WGMMA).</desc>
<rect x="0" y="0" width="720" height="372" fill="#ffffff"/>
<text x="30" y="30" font-size="15" font-weight="600" fill="#2C2C2A">The 4× gap: CUDA-core GEMV vs torch's tensor-core path</text>
<text x="30" y="49" font-size="11" fill="#888780">B300/sm_103, real MLA shape 576/512, h_q=128 — vs_sdpa 0.23–0.29× (3.4–4.3× slower than torch dense-MQA)</text>

<line x1="372" y1="74" x2="372" y2="300" stroke="#E3E1DA" stroke-width="1"/>

