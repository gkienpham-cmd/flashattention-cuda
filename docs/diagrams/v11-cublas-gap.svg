<line x1="88" y1="272" x2="92" y2="272" stroke="#888780" stroke-width="1"/><text x="84" y="275" font-size="9" fill="#888780" text-anchor="end">0</text>
<line x1="88" y1="202" x2="92" y2="202" stroke="#888780" stroke-width="1"/><text x="84" y="205" font-size="9" fill="#888780" text-anchor="end">0.5×</text>
<line x1="88" y1="132" x2="92" y2="132" stroke="#888780" stroke-width="1"/><text x="84" y="135" font-size="9" fill="#888780" text-anchor="end">1.0×</text>
