<svg width="100%" viewBox="0 0 960 600" role="img" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<title>FlashAttention from Scratch — 17 CUDA kernels, 4 GPU architectures, roofline-first</title>
<desc>Portfolio hero diagram summarizing a from-scratch FlashAttention project: 17 CUDA kernels built across T4, A100, B200, and B300 GPUs using a roofline-first predict-then-measure methodology. Three eras — prefill fundamentals (v1-v5), decode optimization (v6-v8.7), and the precision/architecture frontier (v9-v12) — culminating in 8-16x decode speedup over PyTorch SDPA and 1785 TFLOP/s on B300 tensor cores.</desc>

<defs>
<linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#0F172A"/>
<stop offset="1" stop-color="#1E293B"/>
</linearGradient>
<linearGradient id="era1" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#3B82F6"/>
<stop offset="1" stop-color="#2563EB"/>
</linearGradient>
<linearGradient id="era2" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#F59E0B"/>
<stop offset="1" stop-color="#D97706"/>
</linearGradient>
<linearGradient id="era3" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#10B981"/>
<stop offset="1" stop-color="#059669"/>
</linearGradient>
</defs>

<rect x="0" y="0" width="960" height="600" fill="url(#bgGrad)"/>

<!-- ===== HEADER ===== -->
<text x="40" y="52" font-size="30" font-weight="700" fill="#F8FAFC">FlashAttention from Scratch</text>
<text x="40" y="78" font-size="14" fill="#94A3B8">Rebuilt one measured speedup at a time · roofline-first · prediction-vs-reality at every step</text>

<!-- ===== TOP METRIC STRIP ===== -->
<g>
<rect x="40" y="98" width="210" height="70" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
<text x="60" y="128" font-size="28" font-weight="700" fill="#60A5FA">17</text>
<text x="60" y="148" font-size="11.5" fill="#94A3B8">CUDA kernels</text>
<text x="60" y="162" font-size="10" fill="#64748B">v1 naive → v12 tcgen05</text>

<rect x="266" y="98" width="210" height="70" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
<text x="286" y="128" font-size="28" font-weight="700" fill="#FBBF24">4</text>
<text x="286" y="148" font-size="11.5" fill="#94A3B8">GPU architectures</text>
<text x="286" y="162" font-size="10" fill="#64748B">T4 · A100 · B200 · B300</text>

<rect x="492" y="98" width="210" height="70" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
<text x="512" y="128" font-size="28" font-weight="700" fill="#34D399">8–16×</text>
<text x="512" y="148" font-size="11.5" fill="#94A3B8">decode vs PyTorch SDPA</text>
<text x="512" y="162" font-size="10" fill="#64748B">at all batch sizes</text>

<rect x="718" y="98" width="202" height="70" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
<text x="738" y="128" font-size="28" font-weight="700" fill="#34D399">1785</text>
<text x="738" y="148" font-size="11.5" fill="#94A3B8">TFLOP/s on B300</text>
<text x="738" y="162" font-size="10" fill="#64748B">36% of FP8 peak (tcgen05)</text>
</g>

<!-- ===== ERA 1 ===== -->
<rect x="40" y="196" width="880" height="112" rx="10" fill="#0F1A2E" stroke="#1E3A5F" stroke-width="1"/>
<rect x="40" y="196" width="6" height="112" rx="3" fill="url(#era1)"/>
<text x="62" y="220" font-size="13" font-weight="700" fill="#60A5FA">ERA 1 — Prefill fundamentals</text>
<text x="272" y="220" font-size="10.5" fill="#64748B">v1–v5 · T4 (sm_75) · FP32 → FP16 · the bandwidth wall</text>

<!-- v1-v5 chips -->
<g font-size="9">
<rect x="62" y="232" width="158" height="64" rx="6" fill="#152238" stroke="#1E3A5F"/>
<text x="72" y="250" font-size="10.5" font-weight="600" fill="#CBD5E1">v1 · Naive</text>
<text x="72" y="266" fill="#7DD3FC">20–30× slower</text>
<text x="72" y="280" fill="#64748B">AI≈0.25; L2 hides</text>
<text x="72" y="291" fill="#64748B">redundant reads</text>

<rect x="228" y="232" width="158" height="64" rx="6" fill="#152238" stroke="#1E3A5F"/>
<text x="238" y="250" font-size="10.5" font-weight="600" fill="#CBD5E1">v2 · Tiling</text>
<text x="238" y="266" fill="#7DD3FC">1.3–3.2× over v1</text>
<text x="238" y="280" fill="#64748B">ncu: 0% DRAM cut —</text>
<text x="238" y="291" fill="#64748B">S is 99% of traffic</text>

<rect x="394" y="232" width="158" height="64" rx="6" fill="#152238" stroke="#1E3A5F"/>
<text x="404" y="250" font-size="10.5" font-weight="600" fill="#CBD5E1">v3 · Online softmax</text>
<text x="404" y="266" fill="#F87171">3–7× SLOWER</text>
<text x="404" y="280" fill="#64748B">125× less memory,</text>
<text x="404" y="291" fill="#64748B">but schedule regressed</text>

<rect x="560" y="232" width="158" height="64" rx="6" fill="#152238" stroke="#1E3A5F"/>
<text x="570" y="250" font-size="10.5" font-weight="600" fill="#CBD5E1">v4 · Fused FA-1</text>
<text x="570" y="266" fill="#7DD3FC">1.7–2.6× over v2</text>
<text x="570" y="280" fill="#64748B">first S-off-HBM</text>
<text x="570" y="291" fill="#64748B">wall-clock win</text>

<rect x="726" y="232" width="172" height="64" rx="6" fill="#152238" stroke="#1E3A5F"/>
<text x="736" y="250" font-size="10.5" font-weight="600" fill="#CBD5E1">v5 · WMMA cores</text>
<text x="736" y="266" fill="#FBBF24">floor drops 8×</text>
<text x="736" y="280" fill="#64748B">FP16 tensor cores;</text>
<text x="736" y="291" fill="#64748B">GEMV→GEMM fix</text>
</g>

<!-- ===== ERA 2 ===== -->
<rect x="40" y="318" width="880" height="112" rx="10" fill="#241A08" stroke="#3F2D0A" stroke-width="1"/>
<rect x="40" y="318" width="6" height="112" rx="3" fill="url(#era2)"/>
<text x="62" y="342" font-size="13" font-weight="700" fill="#FBBF24">ERA 2 — Decode optimization</text>
<text x="272" y="342" font-size="10.5" fill="#78716C">v6–v8.7 · T4 → A100 · FP16 · the per-CTA wall (+ 4 honest dead ends)</text>

<g font-size="9">
<rect x="62" y="354" width="158" height="64" rx="6" fill="#2A1F0A" stroke="#3F2D0A"/>
<text x="72" y="372" font-size="10.5" font-weight="600" fill="#E7E5E4">v6 · Split-KV</text>
<text x="72" y="388" fill="#FCD34D">5.7–8.2× vs naive</text>
<text x="72" y="402" fill="#78716C">decode pivot; only</text>
<text x="72" y="413" fill="#78716C">9–15% HBM used</text>

<rect x="228" y="354" width="158" height="64" rx="6" fill="#2A1F0A" stroke="#3F2D0A"/>
<text x="238" y="372" font-size="10.5" font-weight="600" fill="#E7E5E4">v7 · Paged KV</text>
<text x="238" y="388" fill="#FCD34D">crossover REFUTED</text>
<text x="238" y="402" fill="#78716C">%HBM flat at every</text>
<text x="238" y="413" fill="#78716C">batch → per-CTA</text>

<rect x="394" y="354" width="158" height="64" rx="6" fill="#2A1F0A" stroke="#3F2D0A"/>
<text x="404" y="372" font-size="10.5" font-weight="600" fill="#E7E5E4">v8 · GQA M-pack</text>
<text x="404" y="388" fill="#FCD34D">8.6× over v7</text>
<text x="404" y="402" fill="#78716C">first roofline win;</text>
<text x="404" y="413" fill="#78716C">beats SDPA 6–10×</text>

<rect x="560" y="354" width="158" height="64" rx="6" fill="#2A1F0A" stroke="#3F2D0A"/>
<text x="570" y="372" font-size="10.5" font-weight="600" fill="#E7E5E4">v8.5/8.6 · 4 nulls</text>
<text x="570" y="388" fill="#F87171">DEAD ENDS</text>
<text x="570" y="402" fill="#78716C">TC, double-buffer,</text>
<text x="570" y="413" fill="#78716C">occupancy, ILP</text>

<rect x="726" y="354" width="172" height="64" rx="6" fill="#2A1F0A" stroke="#F59E0B" stroke-width="1.4"/>
<text x="736" y="372" font-size="10.5" font-weight="600" fill="#FDE68A">v8.7 · Score-stationary</text>
<text x="736" y="388" fill="#34D399">8–16× vs SDPA</text>
<text x="736" y="402" fill="#78716C">remove ≠ hide: 32×</text>
<text x="736" y="413" fill="#78716C">shorter recurrence</text>
</g>

<!-- ===== ERA 3 ===== -->
<rect x="40" y="440" width="880" height="112" rx="10" fill="#0A2018" stroke="#0F3D2E" stroke-width="1"/>
<rect x="40" y="440" width="6" height="112" rx="3" fill="url(#era3)"/>
<text x="62" y="464" font-size="13" font-weight="700" fill="#34D399">ERA 3 — Precision + architecture frontier</text>
<text x="360" y="464" font-size="10.5" fill="#5B7A6E">v9–v12 · T4 → B200 → B300 (sm_103) · FP8 → NVFP4 · MHA → MLA</text>

<g font-size="9">
<rect x="62" y="476" width="200" height="64" rx="6" fill="#0D2A20" stroke="#0F3D2E"/>
<text x="72" y="494" font-size="10.5" font-weight="600" fill="#D1FAE5">v9 · FP8 E4M3 KV</text>
<text x="72" y="510" fill="#6EE7B7">~1.3× · ncu-validated</text>
<text x="72" y="524" fill="#5B7A6E">first hardware-counter</text>
<text x="72" y="535" fill="#5B7A6E">run; %HBM caps 28%</text>

<rect x="270" y="476" width="200" height="64" rx="6" fill="#0D2A20" stroke="#0F3D2E"/>
<text x="280" y="494" font-size="10.5" font-weight="600" fill="#D1FAE5">v10 · NVFP4 (B300)</text>
<text x="280" y="510" fill="#6EE7B7">3.56× capacity</text>
<text x="280" y="524" fill="#5B7A6E">per-CTA on 3 archs;</text>
<text x="280" y="535" fill="#5B7A6E">~40 GB/s ceiling</text>

<rect x="478" y="476" width="200" height="64" rx="6" fill="#0D2A20" stroke="#0F3D2E"/>
<text x="488" y="494" font-size="10.5" font-weight="600" fill="#D1FAE5">v11 · MLA latent-KV</text>
<text x="488" y="510" fill="#6EE7B7">202× capacity</text>
<text x="488" y="524" fill="#5B7A6E">shape right, engine</text>
<text x="488" y="535" fill="#5B7A6E">wrong (4× cuBLAS gap)</text>

<rect x="686" y="476" width="212" height="64" rx="6" fill="#0D2A20" stroke="#10B981" stroke-width="1.4"/>
<text x="696" y="494" font-size="10.5" font-weight="600" fill="#A7F3D0">v12 · tcgen05 tensor cores</text>
<text x="696" y="510" fill="#34D399">1785 TFLOP/s @ scale</text>
<text x="696" y="524" fill="#5B7A6E">"per-CTA forever" was</text>
<text x="696" y="535" fill="#5B7A6E">work-starvation all along</text>
</g>

<!-- ===== FOOTER ===== -->
<text x="40" y="578" font-size="10.5" fill="#64748B">Research target: the first open, prediction-vs-measured roofline characterization of attention decode on B300/sm_103 — complementing, not beating, production kernels.</text>
</svg>
