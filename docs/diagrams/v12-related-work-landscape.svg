<svg width="100%" viewBox="0 0 920 530" role="img" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<title>Related work landscape: what exists, what's missing, and where we fit</title>
<desc>Maps the closest prior art across three axes — attention type (MHA/GQA/MLA), precision (FP16/FP8/FP4), and analysis type (benchmarks/roofline/kernel-level) — showing that kernel-level prediction-vs-measured roofline of MLA decode on sm_103 across FP16-FP8-NVFP4 is the empty cell. Updated 2026-07-01 with SageAttention3 and Mattana blog.</desc>
<rect x="0" y="0" width="920" height="530" fill="#ffffff"/>

<text x="30" y="28" font-size="14" font-weight="600" fill="#2C2C2A">Related work landscape: the empty cell in attention decode characterization</text>
<text x="30" y="46" font-size="10.5" fill="#888780">27 sources surveyed · 7 closest priors identified · none fill our cell (MLA decode x sm_103 x FP16-NVFP4 x prediction-vs-measured roofline)</text>

