<svg width="100%" viewBox="0 0 920 300" role="img" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<title>v12's central correction: the per-CTA wall was work-starvation, not a fixed ceiling</title>
<desc>Left: v6-v11 CUDA-core decode throughput was flat at 0.75 TFLOP/s across six steps and every lever (M-packing, bytes, layout, shape). Right: v12 tcgen05 on the same MLA shape spans 2.4 to 1785 TFLOP/s, scaling with total work B×K. The wall was the wrong engine, not the wrong shape.</desc>
<rect x="0" y="0" width="920" height="300" fill="#ffffff"/>

<text x="30" y="28" font-size="14" font-weight="600" fill="#2C2C2A">The "per-CTA wall" was work-starvation — v12's central correction</text>
<text x="30" y="46" font-size="10.5" fill="#888780">v6→v11: flat 0.75 TFLOP/s regardless of lever · v12: same MLA shape, right engine → 2.4→1785 TFLOP/s</text>

<!-- Left panel: the flat wall -->
<rect x="30" y="62" width="380" height="220" rx="8" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.2"/>
<text x="46" y="86" font-size="11.5" font-weight="700" fill="#991B1B">CUDA-core decode floor (v6→v11, B=1)</text>
<text x="46" y="102" font-size="9.5" fill="#64748B">Achieved TFLOP/s — every bar the same length</text>

<!-- Flat bars with step labels -->
<rect x="46" y="112" width="80" height="13" rx="2" fill="#FCA5A5"/>
<text x="132" y="123" font-size="9" fill="#7F1D1D">v6 split-KV decode: 0.8 TF — %HBM flat 9–15%</text>
<rect x="46" y="129" width="80" height="13" rx="2" fill="#FCA5A5"/>
<text x="132" y="140" font-size="9" fill="#7F1D1D">v7 paged KV: 0.8 TF — %HBM flat at all batch</text>
<rect x="46" y="146" width="82" height="13" rx="2" fill="#FCA5A5"/>
<text x="132" y="157" font-size="9" fill="#7F1D1D">v8 GQA M-pack: 0.8 TF — AI=2G/b, TC dead end</text>
<rect x="46" y="163" width="83" height="13" rx="2" fill="#FCA5A5"/>
<text x="132" y="174" font-size="9" fill="#7F1D1D">v8.7 score-stat: 0.9 TF — layout wins, but cap</text>
<rect x="46" y="180" width="80" height="13" rx="2" fill="#FCA5A5"/>
<text x="132" y="191" font-size="9" fill="#7F1D1D">v9 FP8: 0.8 TF — capacity play, not latency</text>
<rect x="46" y="197" width="78" height="13" rx="2" fill="#FCA5A5"/>
<text x="132" y="208" font-size="9" fill="#7F1D1D">v10 NVFP4: 0.7 TF — per-CTA 7th time</text>
<rect x="46" y="214" width="80" height="13" rx="2" fill="#F87171"/>
<text x="132" y="225" font-size="9" fill="#7F1D1D" font-weight="600">v11 MLA: 0.75 TF — AI 835, still flat</text>

<!-- Vertical "flat" indicator -->
<line x1="126" y1="118" x2="126" y2="221" stroke="#991B1B" stroke-width="1.5" stroke-dasharray="3,2"/>

<text x="46" y="248" font-size="9.5" font-weight="600" fill="#991B1B">Dead ends tested and measured:</text>
<text x="46" y="262" font-size="9" fill="#7F1D1D">tensor cores (Cut 2) · double-buffer (v8.5) · key-ILP (v8.6)</text>
<text x="46" y="274" font-size="9" fill="#7F1D1D">occupancy (v8.6 occ @ B=1) · FP8 bytes · NVFP4 bytes · MLA shape</text>

<!-- Arrow between panels -->
<line x1="418" y1="172" x2="446" y2="172" stroke="#3B82F6" stroke-width="2.5"/>
<polygon points="446,172 436,166 436,178" fill="#3B82F6"/>
<text x="432" y="158" font-size="9" fill="#2563EB" text-anchor="middle" font-weight="600">swap</text>
<text x="432" y="148" font-size="9" fill="#2563EB" text-anchor="middle">engine</text>

<!-- Right panel: scaling -->
<rect x="454" y="62" width="436" height="220" rx="8" fill="#F0FDF4" stroke="#22C55E" stroke-width="1.2"/>
<text x="470" y="86" font-size="11.5" font-weight="700" fill="#166534">tcgen05 tensor cores (v12, B300/sm_103a)</text>
<text x="470" y="102" font-size="9.5" fill="#64748B">Achieved TFLOP/s — scales with total work B×K</text>

<rect x="470" y="112" width="3" height="13" rx="1" fill="#86EFAC"/>
<text x="480" y="123" font-size="9" fill="#166534">B=1, K=256: 2.4 TF (0.05% of 5 PF peak)</text>

<rect x="470" y="133" width="18" height="13" rx="1" fill="#86EFAC"/>
<text x="494" y="144" font-size="9" fill="#166534">B=1, K=8K: 51 TF (1.0%)</text>

<rect x="470" y="154" width="40" height="13" rx="1" fill="#4ADE80"/>
<text x="516" y="165" font-size="9" fill="#166534">B=1, K=131K: 295 TF (5.9%)</text>

<rect x="470" y="175" width="112" height="13" rx="1" fill="#22C55E"/>
<text x="588" y="186" font-size="9" fill="#166534">B=64, K=8K: 945 TF (18.9%)</text>

<rect x="470" y="196" width="218" height="13" rx="1" fill="#16A34A"/>
<text x="694" y="207" font-size="9" fill="#166534">B=64, K=32K: 1473 TF (29.5%)</text>

<rect x="470" y="217" width="370" height="15" rx="2" fill="#15803D"/>
<text x="486" y="229" font-size="9.5" fill="#FFFFFF" font-weight="600">B=64, K=524K: 1785 TF (35.7% FP8 peak / 46.3% HBM)</text>

<text x="470" y="252" font-size="9.5" font-weight="600" fill="#166534">744× throughput span on the same MLA shape.</text>
<text x="470" y="266" font-size="9" fill="#15803D">v11 CUDA-core: flat 0.75 TF → tcgen05: 2.4→1785 TF.</text>
<text x="470" y="278" font-size="9" fill="#15803D">The tool was the whole story.</text>
</svg>
