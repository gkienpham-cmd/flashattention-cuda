<svg width="100%" viewBox="0 0 700 450" role="img" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<title>Decode occupancy-to-bandwidth crossover versus effective batch</title>
<desc>Achieved fraction of HBM bandwidth versus effective batch (B times H, log axis). v6 was measured only at batch 1 (effective batch 8) where it reaches about 12 percent of peak bandwidth — occupancy/launch-bound, far below the roof. As effective batch grows the split-KV kernel self-disables splitting (num_splits to 1) and batch alone fills the SMs, so achieved bandwidth climbs toward the roof. The T4 crossover where splitting stops is at effective batch 80 (two times the 40 SMs); on B300 it is 320 (two times 160 SMs), so the bigger machine needs more batch to fill. Left of the crossover the kernel is occupancy-bound (cutting KV bytes does not help); right of it the kernel is bandwidth-bound (FP4 KV pays). The rising curve past batch 8 is predicted from a code trace, not yet measured.</desc>
<rect x="0" y="0" width="700" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<!-- regime shading (split at the T4 crossover x=361) -->
<rect x="80" y="70" width="281" height="300" fill="#FAECE7" opacity="0.55"/>
<rect x="361" y="70" width="294" height="300" fill="#E1F5EE" opacity="0.55"/>
<!-- axes -->
<line x1="80" y1="55" x2="80" y2="378" stroke="#888780" stroke-width="0.5"/>
<line x1="80" y1="370" x2="655" y2="370" stroke="#888780" stroke-width="0.5"/>
<text x="76" y="48" font-size="12" fill="#5F5E5A">% of HBM bandwidth achieved</text>
<text x="655" y="398" font-size="12" fill="#5F5E5A" text-anchor="end">effective batch  BH = B·H  (log)</text>
<!-- y gridlines -->
<line x1="80" y1="70" x2="655" y2="70" stroke="#185FA5" stroke-width="1.2" stroke-dasharray="5 3"/>
<text x="650" y="66" font-size="11" fill="#185FA5" text-anchor="end">HBM roof — 8 TB/s (B300) · 320 GB/s (T4)</text>
<line x1="80" y1="220" x2="655" y2="220" stroke="#B4B2A9" stroke-width="0.4" stroke-dasharray="3 3"/>
<text x="76" y="224" font-size="10" fill="#888780" text-anchor="end">50%</text>
<text x="76" y="74" font-size="10" fill="#888780" text-anchor="end">100%</text>
<text x="76" y="373" font-size="10" fill="#888780" text-anchor="end">0%</text>
<!-- x ticks: BH = 8,32,80,160,320,1024 -->
<text x="110" y="386" font-size="10" fill="#888780" text-anchor="middle">8</text>
<text x="261" y="386" font-size="10" fill="#888780" text-anchor="middle">32</text>
<text x="437" y="386" font-size="10" fill="#888780" text-anchor="middle">160</text>
<text x="640" y="386" font-size="10" fill="#888780" text-anchor="middle">1024</text>
<!-- crossover seams -->
<line x1="361" y1="70" x2="361" y2="370" stroke="#993C1D" stroke-width="1" stroke-dasharray="4 3"/>
<text x="357" y="120" font-size="11" fill="#993C1D" text-anchor="end">T4 crossover</text>
<text x="357" y="134" font-size="11" fill="#993C1D" text-anchor="end">BH = 2·SM = 80</text>
<line x1="513" y1="70" x2="513" y2="370" stroke="#5F5E5A" stroke-width="0.8" stroke-dasharray="2 3"/>
<text x="517" y="120" font-size="11" fill="#5F5E5A">B300: BH = 320</text>
<text x="517" y="134" font-size="11" fill="#5F5E5A">(160 SMs ⇒ worse</text>
<text x="517" y="148" font-size="11" fill="#5F5E5A">M=1 starvation)</text>
<!-- predicted curve (dashed) -->
<path d="M110,334 L186,304 L261,256 L337,214 L361,196 L413,136 L437,106 L488,88 L564,82 L640,79" fill="none" stroke="#D85A30" stroke-width="2" stroke-dasharray="6 4"/>
<text x="470" y="64" font-size="11" fill="#D85A30" text-anchor="middle">predicted (code-trace; v7 measures it)</text>
<!-- measured v6 point -->
<circle cx="110" cy="334" r="6" fill="#ffffff" stroke="#D85A30" stroke-width="2.5"/>
<text x="122" y="330" font-size="13" fill="#2C2C2A">v6 measured · B=1 · BH=8 · 12% HBM</text>
<text x="122" y="346" font-size="11" fill="#5F5E5A">occupancy/launch-bound — bench only ran B=1</text>
<!-- regime labels -->
<text x="118" y="360" font-size="11" font-weight="500" fill="#993C1D">occupancy-bound (latency / small batch)</text>
<text x="648" y="360" font-size="11" font-weight="500" fill="#0F6E56" text-anchor="end">bandwidth-bound (throughput)</text>
<!-- levers -->
<line x1="300" y1="250" x2="225" y2="250" stroke="#534AB7" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="305" y="247" font-size="11" fill="#3C3489">v8 GQA M-packing shifts crossover left ×G</text>
<text x="305" y="261" font-size="11" fill="#3C3489">(+ raises AI = 2/b → 2G/b)</text>
<text x="520" y="300" font-size="11" fill="#0F6E56">v9/v10 FP4 KV (fewer bytes)</text>
<text x="520" y="314" font-size="11" fill="#0F6E56">only pays in this region →</text>
</svg>
