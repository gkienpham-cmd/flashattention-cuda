<svg width="100%" viewBox="0 0 700 460" role="img" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<title>Decode %HBM is flat across batch — the predicted occupancy-to-bandwidth crossover is measured false (v7, T4)</title>
<desc>Achieved fraction of HBM bandwidth versus effective batch (B times H, log axis), measured on a T4 by the v7 batch sweep at N_k=8192. Two nearly-flat lines: d=64 stays 9.4 to 10.3 percent and d=128 stays 11.4 to 12.4 percent, across effective batch 8 to 512. The earlier prediction — a curve climbing toward the roof past a crossover at effective batch 80 — is shown ghosted and labelled REFUTED, because the measurement shows no climb at all. Even at effective batch 512 the grid is 12.8 blocks per SM, far over-subscribed, yet bandwidth does not move: the wall is inside each CTA (32 KB of shared memory caps residency at 2 blocks per SM, and at N_q=1 only 1 of 8 warps computes), not at the grid level. The next lever is per-CTA efficiency (GQA M-packing, GEMV to GEMM), not more batch and not fewer bytes.</desc>
<rect x="0" y="0" width="700" height="460" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<!-- measured-floor band 0 - 12.5% -->
<rect x="80" y="333" width="575" height="37" fill="#E1F5EE" opacity="0.7"/>
<!-- axes -->
<line x1="80" y1="55" x2="80" y2="378" stroke="#888780" stroke-width="0.5"/>
<line x1="80" y1="370" x2="655" y2="370" stroke="#888780" stroke-width="0.5"/>
<text x="76" y="48" font-size="12" fill="#5F5E5A">% of HBM bandwidth achieved</text>
<text x="655" y="404" font-size="12" fill="#5F5E5A" text-anchor="end">effective batch  BH = B·H  (log)</text>
<!-- y gridlines -->
<line x1="80" y1="70" x2="655" y2="70" stroke="#185FA5" stroke-width="1.2" stroke-dasharray="5 3"/>
<text x="650" y="66" font-size="11" fill="#185FA5" text-anchor="end">HBM roof — 320 GB/s (T4) · 8 TB/s (B300)</text>
<line x1="80" y1="220" x2="655" y2="220" stroke="#B4B2A9" stroke-width="0.4" stroke-dasharray="3 3"/>
<text x="76" y="224" font-size="10" fill="#888780" text-anchor="end">50%</text>
<text x="76" y="74" font-size="10" fill="#888780" text-anchor="end">100%</text>
<text x="76" y="373" font-size="10" fill="#888780" text-anchor="end">0%</text>
<!-- x ticks: BH = 8,64,128,256,512 (B=1,8,16,32,64 @ H=8) -->
<text x="110" y="386" font-size="10" fill="#888780" text-anchor="middle">8</text>
<text x="337" y="386" font-size="10" fill="#888780" text-anchor="middle">64</text>
<text x="413" y="386" font-size="10" fill="#888780" text-anchor="middle">128</text>
<text x="488" y="386" font-size="10" fill="#888780" text-anchor="middle">256</text>
<text x="564" y="386" font-size="10" fill="#888780" text-anchor="middle">512</text>
<text x="337" y="398" font-size="9" fill="#B4B2A9" text-anchor="middle">B=8</text>
<text x="564" y="398" font-size="9" fill="#B4B2A9" text-anchor="middle">B=64 · 12.8 blocks/SM</text>
<!-- ghosted PREDICTED arc (refuted) -->
<path d="M110,334 L186,304 L261,256 L337,214 L361,196 L413,136 L437,106 L488,88 L564,82 L640,79" fill="none" stroke="#C8C6BE" stroke-width="2" stroke-dasharray="6 4"/>
<text x="486" y="150" font-size="11" fill="#A6A39A" text-anchor="middle">predicted crossover —</text>
<text x="486" y="164" font-size="11" font-weight="600" fill="#993C1D" text-anchor="middle">REFUTED 2026-06-27</text>
<line x1="486" y1="168" x2="470" y2="120" stroke="#C8C6BE" stroke-width="0.8"/>
<!-- measured d=128 line -->
<path d="M110,333 L337,336 L413,336 L488,335 L564,333" fill="none" stroke="#0F6E56" stroke-width="2.2"/>
<circle cx="110" cy="333" r="3.5" fill="#0F6E56"/><circle cx="337" cy="336" r="3.5" fill="#0F6E56"/><circle cx="413" cy="336" r="3.5" fill="#0F6E56"/><circle cx="488" cy="335" r="3.5" fill="#0F6E56"/><circle cx="564" cy="333" r="3.5" fill="#0F6E56"/>
<text x="572" y="330" font-size="11" fill="#0F6E56">d=128 — flat 11.4–12.4%</text>
<!-- measured d=64 line -->
<path d="M110,341 L337,342 L413,342 L488,342 L564,339" fill="none" stroke="#185FA5" stroke-width="2.2"/>
<circle cx="110" cy="341" r="3.5" fill="#185FA5"/><circle cx="337" cy="342" r="3.5" fill="#185FA5"/><circle cx="413" cy="342" r="3.5" fill="#185FA5"/><circle cx="488" cy="342" r="3.5" fill="#185FA5"/><circle cx="564" cy="339" r="3.5" fill="#185FA5"/>
<text x="572" y="352" font-size="11" fill="#185FA5">d=64 — flat 9.4–10.3%</text>
<!-- measured-floor label -->
<text x="120" y="358" font-size="11" font-weight="500" fill="#0F6E56">MEASURED — per-CTA-bound, ≥8× below the wall</text>
<!-- the per-CTA cause -->
<text x="120" y="100" font-size="12" font-weight="600" fill="#2C2C2A">The wall is inside the CTA, not at the grid</text>
<text x="120" y="118" font-size="11" fill="#5F5E5A">sK+sV = 32 KB → 2 blocks/SM (batch-independent)</text>
<text x="120" y="132" font-size="11" fill="#5F5E5A">N_q=1 → only 1 of 8 warps computes (GEMV)</text>
<text x="120" y="146" font-size="11" fill="#5F5E5A">batch adds waves, not per-SM parallelism → flat</text>
<!-- v8 lever -->
<line x1="300" y1="248" x2="240" y2="335" stroke="#534AB7" stroke-width="1.4" marker-end="url(#arrow)"/>
<text x="300" y="236" font-size="11" fill="#3C3489">v8 GQA M-packing: M=G → G warps + GEMV→GEMM,</text>
<text x="300" y="250" font-size="11" fill="#3C3489">KV read once (AI = 2/b → 2G/b) — the actual lever</text>
</svg>
