<svg width="100%" viewBox="0 0 760 430" role="img" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<title>v9 Task 1 — decode %HBM vs N_k is flat far below the ceiling with no knee at the L2 crossing: per-CTA / low-MLP bound, confound-free</title>
<desc>Achieved HBM bandwidth as a percent of the T4's 320 GB/s peak, versus KV length N_k from 1K to 128K on a log axis, root T4 with clocks locked at 1590 MHz and L2 flushed between iterations, d=128. Three lines. v8_gqa_ss FP16 at high occupancy (H_kv=8) rises then plateaus at a hard 27 to 29 percent cap. v8_gqa_ss FP16 at low occupancy (H_kv=1) plateaus near 11 to 14 percent. v9_fp8 at H_kv=8 sits near 10 percent because it moves half the bytes over a per-CTA-bound time. The dotted line at 70 percent marks the achievable memory-bound ceiling that none of the lines approach. A dashed vertical at N_k about 7800 marks where the FP16 KV working set crosses the 4 MB L2; there is no bandwidth knee there. ncu at N_k=65536 measured DRAM throughput 12.85 percent and L2 hit-rate 1.1 percent, matching the counter-free 13.8 percent and proving the data streams from HBM yet the bus is only 13 percent busy: not bandwidth-bound.</desc>
<rect x="0" y="0" width="760" height="430" fill="#ffffff"/>
<defs><marker id="arr9" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="30" y="28" font-size="15" font-weight="600" fill="#2C2C2A">v9 Task 1 — decode %HBM vs N_k: flat, far below the ceiling, no L2 knee</text>
<text x="30" y="46" font-size="11" fill="#888780">root T4 · clocks LOCKED 1590 MHz · L2 flushed · d=128 — the kernel is per-CTA / low-MLP bound, not bandwidth-bound</text>

<!-- plot frame -->
<rect x="90" y="70" width="570" height="290" fill="#FCFCFB" stroke="#D7D5CC" stroke-width="1"/>

<!-- y gridlines + ticks (0,10,20,30,40,70) -->
<line x1="90" y1="360" x2="660" y2="360" stroke="#E3E1DA" stroke-width="1"/><text x="84" y="364" font-size="9" fill="#888780" text-anchor="end">0%</text>
<line x1="90" y1="321.3" x2="660" y2="321.3" stroke="#EFEEE9" stroke-width="1"/><text x="84" y="325" font-size="9" fill="#888780" text-anchor="end">10%</text>
<line x1="90" y1="282.7" x2="660" y2="282.7" stroke="#EFEEE9" stroke-width="1"/><text x="84" y="286" font-size="9" fill="#888780" text-anchor="end">20%</text>
<line x1="90" y1="244" x2="660" y2="244" stroke="#EFEEE9" stroke-width="1"/><text x="84" y="248" font-size="9" fill="#888780" text-anchor="end">30%</text>
<line x1="90" y1="205.3" x2="660" y2="205.3" stroke="#EFEEE9" stroke-width="1"/><text x="84" y="209" font-size="9" fill="#888780" text-anchor="end">40%</text>

<!-- 28% per-CTA cap -->
<line x1="90" y1="251.7" x2="660" y2="251.7" stroke="#185FA5" stroke-width="1" stroke-dasharray="2 3" opacity="0.6"/>
<text x="655" y="263" font-size="9" fill="#185FA5" text-anchor="end">~28% per-CTA cap (full occupancy)</text>

<!-- 70% achievable ceiling -->
<line x1="90" y1="89.3" x2="660" y2="89.3" stroke="#7A7770" stroke-width="1.2" stroke-dasharray="1 3"/>
<text x="96" y="85" font-size="10" fill="#5F5E5A">~70% — achievable memory-bound ceiling (no line gets close)</text>

<!-- L2 crossing -->
<line x1="328.6" y1="70" x2="328.6" y2="360" stroke="#2C2C2A" stroke-width="1" stroke-dasharray="4 3" opacity="0.55"/>
<text x="333" y="84" font-size="9" fill="#2C2C2A">KV crosses 4 MB L2 (N_k≈7.8K)</text>
<text x="333" y="96" font-size="9" fill="#993C1D">→ no knee here</text>

<!-- x ticks (log2 N_k) -->
<text x="90" y="376" font-size="9" fill="#888780" text-anchor="middle">1K</text>
<text x="171.4" y="376" font-size="9" fill="#888780" text-anchor="middle">2K</text>
<text x="252.9" y="376" font-size="9" fill="#888780" text-anchor="middle">4K</text>
<text x="334.3" y="376" font-size="9" fill="#888780" text-anchor="middle">8K</text>
<text x="415.7" y="376" font-size="9" fill="#888780" text-anchor="middle">16K</text>
<text x="497.1" y="376" font-size="9" fill="#888780" text-anchor="middle">32K</text>
<text x="578.6" y="376" font-size="9" fill="#888780" text-anchor="middle">64K</text>
<text x="660" y="376" font-size="9" fill="#888780" text-anchor="middle">128K</text>
<text x="375" y="394" font-size="10" fill="#5F5E5A" text-anchor="middle">N_k (KV length, log scale) →</text>
<text x="34" y="215" font-size="10" fill="#5F5E5A" text-anchor="middle" transform="rotate(-90 34 215)">% of peak HBM BW</text>

<!-- v8_gqa_ss H_kv=8 (FP16, high occ) — the 28% cap line -->
<polyline points="90,314.8 171.4,277.3 252.9,253.3 334.3,251.0 415.7,248.3 497.1,257.1 578.6,257.1 660,257.1" fill="none" stroke="#185FA5" stroke-width="2.2"/>
<g fill="#185FA5"><circle cx="90" cy="314.8" r="2.6"/><circle cx="171.4" cy="277.3" r="2.6"/><circle cx="252.9" cy="253.3" r="2.6"/><circle cx="334.3" cy="251.0" r="2.6"/><circle cx="415.7" cy="248.3" r="2.6"/><circle cx="497.1" cy="257.1" r="2.6"/><circle cx="578.6" cy="257.1" r="2.6"/><circle cx="660" cy="257.1" r="2.6"/></g>

<!-- v8_gqa_ss H_kv=1 (FP16, low occ) -->
<polyline points="90,353.4 171.4,347.2 252.9,335.3 334.3,317.5 415.7,313.2 497.1,316.3 578.6,306.6 660,303.9" fill="none" stroke="#888780" stroke-width="2"/>
<g fill="#888780"><circle cx="90" cy="353.4" r="2.4"/><circle cx="334.3" cy="317.5" r="2.4"/><circle cx="578.6" cy="306.6" r="2.4"/><circle cx="660" cy="303.9" r="2.4"/></g>

<!-- v9_fp8 H_kv=8 -->
<polyline points="90,344.1 171.4,331.0 252.9,321.7 334.3,320.9 415.7,322.1 497.1,322.1 578.6,321.7 660,321.7" fill="none" stroke="#D85A30" stroke-width="2" stroke-dasharray="5 2"/>
<g fill="#D85A30"><circle cx="90" cy="344.1" r="2.4"/><circle cx="334.3" cy="320.9" r="2.4"/><circle cx="660" cy="321.7" r="2.4"/></g>

<!-- ncu annotation at past-L2 -->
<line x1="578.6" y1="306.6" x2="560" y2="150" stroke="#3C8C5A" stroke-width="1" marker-end="url(#arr9)"/>
<rect x="430" y="120" width="232" height="34" rx="4" fill="#EAF4EE" stroke="#3C8C5A" stroke-width="0.8"/>
<text x="440" y="134" font-size="9" fill="#226B40">ncu @ N_k=65536: DRAM 12.85% · L2-hit 1.1%</text>
<text x="440" y="147" font-size="9" fill="#226B40">= HBM-served yet 13% busy → NOT bandwidth-bound</text>

<!-- legend -->
<g font-size="10">
<rect x="100" y="404" width="16" height="3" fill="#185FA5"/><text x="120" y="408" fill="#5F5E5A">v8_gqa_ss FP16 · H_kv=8 (high occ → 28% cap)</text>
<rect x="370" y="404" width="16" height="3" fill="#888780"/><text x="390" y="408" fill="#5F5E5A">FP16 · H_kv=1 (low occ ~14%)</text>
<rect x="585" y="404" width="16" height="3" fill="#D85A30"/><text x="605" y="408" fill="#5F5E5A">v9_fp8 · H_kv=8 (~10%)</text>
</g>
</svg>
