<svg width="100%" viewBox="0 0 940 452" role="img" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<title>MLA latent-KV decode — 202x KV-cache capacity over MHA, at the FP8 accuracy floor (NVFP4 = 3.5x FP8 RMSE, latent-width-independent)</title>
<desc>Two panels for v11 MLA latent-KV decode, measured on B300/sm_103 and T4. LEFT panel (Capacity): KV-cache footprint per the measured pool at N_k=65536 (page 256), shown as descending bars on a log y-axis in MB. MHA stores the full 32768 dims/token = 4295 MB. GQA-8 stores 2048 dims/token = 268 MB, a 16x cut versus MHA. MLA-NVFP4 stores ONE shared latent of 576 dims/token at 0.5625 bytes/element = 21 MB. That is 202.3x smaller than MHA and 12.6x smaller than GQA-8 — a 99.5% reduction. The capacity win is structural (by construction): MLA reads one latent for all 128 query heads, NVFP4 packs it at 0.5625 B/elem. RIGHT panel (Accuracy): end-to-end RMSE versus a reference, three bars on a linear y-axis. The kernel-vs-oracle error is about 2e-5 (FP16 latent, kernel math is exact — no quantization). FP8-latent quant error is about 7e-4. NVFP4-latent quant error is about 2.5e-3 = 3.5x the FP8 error — E2M1's 1-bit mantissa sets a hard FP4 accuracy floor that is independent of latent width (same 3.5x as v10's dense NVFP4). Takeaway: MLA + NVFP4 is a 202x capacity win by construction; the cost is 3.5x FP8 RMSE (the floor). FP4 buys bytes, not accuracy, and on a per-CTA-bound CUDA-core decode kernel it buys no latency either (that needs tensor cores, the v11 future arm).</desc>
<rect x="0" y="0" width="940" height="452" fill="#ffffff"/>

<text x="30" y="30" font-size="15" font-weight="600" fill="#2C2C2A">MLA latent-KV decode — 202× capacity, at the FP8 floor</text>
<text x="30" y="49" font-size="11" fill="#888780">One shared latent for all 128 heads + NVFP4 storage, at N_k=65536.</text>

