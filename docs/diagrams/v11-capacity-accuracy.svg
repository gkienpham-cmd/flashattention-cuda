<rect x="178" y="166" width="166" height="20" rx="4" fill="#EAF4EE" stroke="#3C8C5A" stroke-width="0.8"/>
<text x="261" y="180" font-size="10" font-weight="600" fill="#226B40" text-anchor="middle">202× vs MHA / 12.6× vs GQA-8</text>

