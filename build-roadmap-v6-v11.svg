<svg width="100%" viewBox="0 0 700 480" role="img" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
<title>Reordered build plan v6 to v11 — occupancy before bytes</title>
<desc>Six stages, reordered after v6's measurement. v6 split-KV decode is done on the T4 and measured at about 12 percent of HBM, occupancy-bound. v7 paged KV gather plus harness fixes is occupancy-neutral plumbing on T4 or rented GPU. v8 GQA M-packing is the reordered pivotal step: it turns the GEMV into a GEMM, raises arithmetic intensity from 2 over b to 2G over b, and reads KV once, attacking occupancy and intensity together. Only then come the byte levers: v9 FP8 KV cache halves bytes, and v10 NVFP4 plus asymmetric precision is the headline on B300 with about 3.5 times fewer bytes. v11 MLA or speculative decode raises intensity toward the ridge on B300. The old order put FP8 and NVFP4 before GQA; it was reordered because v6 measured occupancy, not bytes, as the active limiter.</desc>
<rect x="0" y="0" width="700" height="480" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<text x="40" y="30" font-size="14" font-weight="500" fill="#2C2C2A">Decode build plan v6 → v11 — reordered: occupancy before bytes</text>
<!-- v6 -->
<rect x="40" y="44" width="620" height="46" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="54" y="64" font-size="13" font-weight="500" fill="#444441">v6 — split-KV decode (FP16)   ·   DONE</text>
<text x="54" y="81" font-size="11" fill="#5F5E5A">decode roofline + LSE merge · T4</text>
<rect x="498" y="55" width="150" height="22" rx="11" fill="#EAE9E3" stroke="#888780" stroke-width="0.5"/>
<text x="573" y="70" font-size="10.5" fill="#5F5E5A" text-anchor="middle">measured · 12% HBM</text>
<line x1="70" y1="90" x2="70" y2="102" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#arrow)"/>
<!-- v7 -->
<rect x="40" y="104" width="620" height="46" rx="4" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="54" y="124" font-size="13" font-weight="500" fill="#444441">v7 — paged KV gather + harness fix</text>
<text x="54" y="141" font-size="11" fill="#5F5E5A">block-table indirection · --batch sweep + causal query-offset · T4/rented</text>
<rect x="498" y="115" width="150" height="22" rx="11" fill="#EAE9E3" stroke="#888780" stroke-width="0.5"/>
<text x="573" y="130" font-size="10.5" fill="#5F5E5A" text-anchor="middle">occupancy-neutral</text>
<line x1="70" y1="150" x2="70" y2="162" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#arrow)"/>
<!-- v8 reordered -->
<rect x="40" y="164" width="620" height="46" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.1"/>
<text x="54" y="184" font-size="13" font-weight="500" fill="#3C3489">v8 — GQA M-packing  (AI = 2/b → 2G/b)   ★ reordered</text>
<text x="54" y="201" font-size="11" fill="#534AB7">GEMV→GEMM, tensor cores re-engage, KV read once · rented A100/H100</text>
<rect x="486" y="175" width="162" height="22" rx="11" fill="#534AB7"/>
<text x="567" y="190" font-size="10.5" fill="#ffffff" text-anchor="middle">OCCUPANCY + INTENSITY</text>
<line x1="70" y1="210" x2="70" y2="222" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#arrow)"/>
<!-- v9 -->
<rect x="40" y="224" width="620" height="46" rx="4" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="54" y="244" font-size="13" font-weight="500" fill="#0C447C">v9 — FP8 KV cache</text>
<text x="54" y="261" font-size="11" fill="#185FA5">first byte cut, inline dequant · B300 (H100 ok for correctness)</text>
<rect x="528" y="235" width="120" height="22" rx="11" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="588" y="250" font-size="10.5" fill="#085041" text-anchor="middle">BYTES ×2</text>
<line x1="70" y1="270" x2="70" y2="282" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#arrow)"/>
<!-- v10 headline -->
<rect x="40" y="284" width="620" height="46" rx="4" fill="#FAECE7" stroke="#993C1D" stroke-width="0.7"/>
<text x="54" y="304" font-size="13" font-weight="500" fill="#712B13">v10 — NVFP4 + asymmetric precision</text>
<text x="54" y="321" font-size="11" fill="#993C1D">the headline: ~3.5× fewer bytes (b ≈ 0.56), asymmetric FP4 P·V / MXFP8 scores · B300</text>
<rect x="512" y="295" width="136" height="22" rx="11" fill="#993C1D"/>
<text x="580" y="310" font-size="10.5" fill="#ffffff" text-anchor="middle">BYTES · HEADLINE</text>
<line x1="70" y1="330" x2="70" y2="342" stroke="#5F5E5A" stroke-width="1.4" marker-end="url(#arrow)"/>
<!-- v11 -->
<rect x="40" y="344" width="620" height="46" rx="4" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="54" y="364" font-size="13" font-weight="500" fill="#0C447C">v11 — MLA / speculative decode (stretch)</text>
<text x="54" y="381" font-size="11" fill="#185FA5">latent-KV (AI → 2H/b) / draft M&gt;1 · raise intensity toward the ridge · B300</text>
<rect x="514" y="355" width="134" height="22" rx="11" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="581" y="370" font-size="10.5" fill="#0C447C" text-anchor="middle">INTENSITY → RIDGE</text>
<!-- old-order ghost -->
<rect x="40" y="402" width="620" height="26" rx="4" fill="#F7F6F1" stroke="#D9D7CE" stroke-width="0.5"/>
<text x="54" y="419" font-size="11" fill="#A8A69D"><tspan text-decoration="line-through">OLD ORDER (pre-v6): v8 FP8 · v9 NVFP4 · v10 GQA</tspan>  → reordered after v6 measured occupancy, not bytes, as the active limiter</text>
<!-- legend -->
<rect x="40" y="440" width="13" height="13" rx="2" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="59" y="450" font-size="11" fill="#5F5E5A">develop cheap (T4/rented)</text>
<rect x="240" y="440" width="13" height="13" rx="2" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="259" y="450" font-size="11" fill="#5F5E5A">the reorder (occupancy lever)</text>
<rect x="448" y="440" width="13" height="13" rx="2" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="467" y="450" font-size="11" fill="#5F5E5A">B300 milestone</text>
<rect x="592" y="440" width="13" height="13" rx="2" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="611" y="450" font-size="11" fill="#5F5E5A">headline</text>
</svg>
